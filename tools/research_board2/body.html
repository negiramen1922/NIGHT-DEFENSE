<div class="wrap">
  <div class="head">
    <h1>研究</h1>
    <span class="sum" id="sum">読み込み中…</span>
    <div class="legend">
      <span><i style="background:var(--green)"></i>残す・入れる</span>
      <span><i style="background:var(--amber)"></i>変える</span>
      <span><i style="background:var(--red)"></i>消す・やめる</span>
      <span><i style="border:1px dashed #b89a4a"></i>案</span>
      <span><i style="border:1px solid var(--cyan)"></i>足したカード・つないだ線</span>
    </div>
    <span class="save" id="save" aria-live="polite"></span>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="tools" id="tools">
    <button data-f="all" class="on">すべて</button>
    <button data-f="prop">案だけ</button>
    <button data-f="note">書き込みあり</button>
    <button id="kcTg">改築の研究（まとめ）を出す</button>
    <span class="sep"></span>
    <button id="addBtn">＋ 研究を足す</button>
    <button id="linkBtn">線をつなぐ</button>
    <span class="msg" id="msg">カードはドラッグで動かせます（列を動かすと、取れるランクが変わる）</span>
  </div>
  <div class="board" id="board"><div class="ranks" id="ranks"></div><div class="tree" id="tree"></div></div>
  <div class="det" id="det"><div class="empty">研究を押すと、ここに詳しい内容と書き込み欄が出ます。「残す／変える／消す」を選んで、思ったことを書いてください（書いたら自動で保存されます）。</div></div>
</div>
<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const RN=['0','Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ','Ⅶ','Ⅷ','Ⅸ'];
const TC={'N領地':'var(--c-prod)','N防衛':'var(--c-def)','N部隊':'var(--c-army)','生産':'var(--c-prod)','内政':'var(--c-gov)','防衛':'var(--c-def)','部隊':'var(--c-army)','魔核':'var(--c-mat)'};
const STX={keep:['残す','var(--green)'],change:['変える','var(--amber)'],drop:['消す','var(--red)'],adopt:['入れる','var(--green)'],reject:['やめる','var(--red)']};
const W=212,G=46,CH=70,VG=10;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// もとのカード（Lvのある研究は Ⅰ・Ⅱ・Ⅲ に分ける）
const BASE=[];const nodeById={};
for(const t of D.T){if(t.lv){for(let k=1;k<=3;k++){const id=t.id+'_'+k;const n=Object.assign({},t,{id,base:t.id,r:Math.min(7,t.r+(k-1)*2),n:t.n+['','Ⅰ','Ⅱ','Ⅲ'][k],pre:k===1?t.pre:[t.id+'_'+(k-1)],lvk:k,e:t.e.replace(/（Lvごと[^）]*）/,'').replace(/（最大は城のランクまで）/,'')});BASE.push(n);nodeById[id]=n;}nodeById[t.id]=nodeById[t.id+'_1'];}
  else{const n=Object.assign({},t);BASE.push(n);nodeById[t.id]=n;}}
for(const n of BASE)n.pre=(n.pre||[]).map(p=>nodeById[p]?nodeById[p].id:p);
// 保存しているもの
const notes={},posO={},links={},custom={};let db=null,canWrite=true;
let tab=D.tabs[0],sel=null,filt='all',showKc=false,linkMode=false,linkSrc=null;
function allNodes(){const C=Object.entries(custom).map(([id,c])=>({id,cat:c.cat,r:c.r||1,n:c.n||'（名前なし）',e:c.e||'',pre:[],mx:1,custom:true,un:[],c:'',tt:0}));for(const c of C)nodeById[c.id]=c;return BASE.concat(C);}
function stOf(id){const n=notes[id];return n&&n.st&&STX[n.st]?n.st:'';}
function hasNote(id){const n=notes[id];return !!(n&&(n.st||(n.note||'').trim()));}
function visible(t){if(t.cat!==tab)return false;if(t.kc&&!t.stage&&!showKc)return false;
  return filt==='all'||(filt==='prop'&&(t.prop||t.custom))||(filt==='note'&&hasNote(t.id));}
function edgesOf(L){const ids=new Set(L.map(t=>t.id));const E=[];
  for(const t of L)for(const p of t.pre){if(!ids.has(p))continue;const k=p+'>'+t.id;if(links[k]&&links[k].on===false)continue;E.push({a:p,b:t.id,kind:t.prop&&t.prop!=='新'?'p':t.lvk>1?'lv':''});}
  for(const [k,v] of Object.entries(links)){if(!v.on)continue;if(ids.has(v.from)&&ids.has(v.to)&&!E.some(e=>e.a===v.from&&e.b===v.to))E.push({a:v.from,b:v.to,kind:'u'});}
  return E;}
function layout(L,E){const ids=new Set(L.map(t=>t.id));const kids={},hasPar=new Set();
  for(const t of L)for(const p of t.pre){if(!ids.has(p)||hasPar.has(t.id))continue;(kids[p]=kids[p]||[]).push(t);hasPar.add(t.id);}
  const roots=L.filter(t=>!hasPar.has(t.id)).sort((a,b)=>((b.top?1:0)-(a.top?1:0))||a.r-b.r);
  for(const k in kids)kids[k].sort((a,b)=>((b.lvk?1:0)-(a.lvk?1:0))||a.r-b.r);
  const pos={};let next=0;const seen=new Set();
  function place(t,row,pc){if(seen.has(t.id))return;seen.add(t.id);const col=Math.max(t.r,pc);pos[t.id]={row,col};next=Math.max(next,row+1);let r=row,first=true;
    const ks=(kids[t.id]||[]).slice().sort((a,b)=>(Math.max(a.r,col)===col?1:0)-(Math.max(b.r,col)===col?1:0));
    for(const c of ks){const same=Math.max(c.r,col)===col;if(!first||same)r=next;place(c,r,col);first=false;}next=Math.max(next,row+1);}
  for(const t of roots)place(t,next,0);
  for(const t of L)if(!pos[t.id]){pos[t.id]={row:next++,col:t.r};}
  // 前の並び（FIX）があるカードはそこに置く。新しいカードは空いているマスへ（作り直しても並びがずれないように）
  {const F=D.FIX||{};const fx=new Set();for(const t of L){const f=F[t.id];if(f&&f.cat===tab){pos[t.id]={row:f.row,col:f.col};fx.add(t.id);}}
   const occ=new Set();for(const t of L)if(fx.has(t.id))occ.add(pos[t.id].col+':'+pos[t.id].row);
   for(const t of L){if(fx.has(t.id))continue;const p=pos[t.id];while(occ.has(p.col+':'+p.row))p.row++;occ.add(p.col+':'+p.row);}}
  // 動かしていないカードは動かない。動かしたカードは、空いているマスに置く
  const used=new Set();for(const t of L)if(!(posO[t.id]&&posO[t.id].cat===tab))used.add(pos[t.id].col+':'+pos[t.id].row);
  for(const t of L){const o=posO[t.id];if(!(o&&o.cat===tab))continue;let r=o.row;while(used.has(o.col+':'+r))r++;pos[t.id]={row:r,col:o.col,moved:true};used.add(o.col+':'+r);}
  return pos;}
function renderTabs(){const AN=allNodes();$('tabs').innerHTML=D.tabs.map(c=>{const L=AN.filter(t=>t.cat===c&&!(t.kc&&!t.stage));const w=L.filter(t=>hasNote(t.id)).length;
  return `<button role="tab" data-tab="${c}" class="${c===tab?'on':''}" style="--tc:${TC[c]}" aria-selected="${c===tab}">${D.CATIC&&D.CATIC[c]?`<i class="catic" style="-webkit-mask-image:url(${D.CATIC[c]});mask-image:url(${D.CATIC[c]})"></i>`:''}${(D.TABL&&D.TABL[c])||c}<span class="n">${L.length}${w?`・書${w}`:''}</span></button>`;}).join('');
  $('tabs').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;linkSrc=null;render();});}
let POS={};const C0=()=>(tab[0]==='N'?0:1);
function cardHTML(t,p){const st=stOf(t.id),n=notes[t.id];const memo=n&&(n.note||'').trim();const off=p.col!==t.r;
  const tags=[];if(t.custom)tags.push('<span class="tag new">足したカード</span>');if(t.prop==='新'){tags.push(`<span class="tag tg-${({'ランクで開く':'rank','はじめから':'rank','研究':'res','そのほか':'res','改造':'mod','案':'idea','なくす':'gone'})[t.tg]||'res'}">${esc(t.tg)}</span>`);}
  else if(t.prop)tags.push(`<span class="tag ${t.prop==='案3'?'p3':'p4'}">${t.prop==='見本'?esc(t.tg):t.prop}</span>`);if(t.art)tags.push('<span class="tag art">新しい絵</span>');
  if(t.stage)tags.push(`<span class="tag stg">改築${t.by?'・'+esc(t.by):''}</span>`);else if(t.kc)tags.push('<span class="tag kc">改築</span>');
  if(t.ln==='工'&&(!t.prop||t.prop==='新'))tags.push('<span class="tag ind">工業</span>');if(t.ln==='魔')tags.push('<span class="tag mag">魔法</span>');
  if(t.mv&&!(t.lvk>1))tags.push(`<span class="tag mv">→ ${esc(t.mv)}</span>`);if(st)tags.push(`<span class="tag st" style="--stc:${STX[st][1]}">${STX[st][0]}</span>`);
  const xp=(t.pre||[]).filter(q=>nodeById[q]&&nodeById[q].cat!==t.cat).map(q=>nodeById[q].n+'（'+nodeById[q].cat+'）');
  const x=12+(p.col-C0())*(W+G),y=12+p.row*(CH+VG);
  return `<button class="card${t.kc?' kc':''}${t.stage?' stage':''}${t.prop&&t.prop!=='新'?' prop':''}${t.prop==='新'&&(t.tg==='ランクで開く'||t.tg==='はじめから')?' auto':''}${t.prop==='新'&&t.tg==='なくす'?' gone':''}${t.custom?' custom':''}${sel===t.id?' sel':''}${linkSrc===t.id?' src':''}" data-id="${t.id}" style="--stc:${st?STX[st][1]:'transparent'};left:${x}px;top:${y}px;width:${W}px;--ch:${CH}px">
    <div class="tt">${t.ic&&D.IC[t.ic]?`<img class="ic" src="${D.IC[t.ic]}" alt="">`:''}<b>${esc(t.n)}</b><span class="lv"${off?' style="color:var(--amber)"':''}>${off?`ランク${RN[t.r]}→${RN[p.col]||p.col}`:'ランク'+RN[t.r]}</span></div>
    <div class="e">${t.prop&&t.prop!=='見本'&&t.prop!=='新'?`${esc(t.tg)}：`:''}${esc(t.e)||'（効果を書いてください）'}</div>
    ${xp.length?`<div class="xp">← ${esc(xp.join('・'))}</div>`:''}${memo?`<div class="memo">✎ ${esc(memo)}</div>`:tags.length?`<div class="tags">${tags.join('')}</div>`:''}</button>`;}
function render(){renderTabs();const AN=allNodes();
  const L=AN.filter(visible),E=edgesOf(L);const pos=layout(L,E);POS=pos;
  let maxRow=0,maxCol=7;for(const k in pos){maxRow=Math.max(maxRow,pos[k].row);maxCol=Math.max(maxCol,pos[k].col);}maxCol=Math.max(maxCol,7);
  const X=c=>12+(c-C0())*(W+G),Y=r=>12+r*(CH+VG);
  $('ranks').innerHTML=Array.from({length:maxCol+2-C0()},(_,i)=>{const c=i+C0();const first=c===C0();const m=(D.RANKMAT||{})[c===0?1:(C0()===0&&c===1?-1:c)]||[];
    return `<div style="width:${W+G}px">${c<=7?(c===0?'ランク 0（はじめから）':'ランク '+RN[c]):''}${c<=7&&m.length?`<span class="rmat" title="このランクで使えるようになる素材">${first?'':'＋'}${m.map(k=>`<span><img src="${D.IC['r.'+k]}" alt="">${D.RESN[k]}</span>`).join('')}</span>`:''}</div>`;}).join('');
  const SAMEL={};{const se=E.filter(e=>pos[e.a]&&pos[e.b]&&pos[e.a].col===pos[e.b].col).map(e=>({k:e.a+'>'+e.b,c:pos[e.a].col,lo:Math.min(pos[e.a].row,pos[e.b].row),hi:Math.max(pos[e.a].row,pos[e.b].row)})).sort((a,b)=>a.lo-b.lo);const used={};for(const s of se){const L=used[s.c]=used[s.c]||[];let l=0;while(L.some(o=>o.l===l&&!(o.hi<s.lo||o.lo>s.hi)))l++;L.push({l,lo:s.lo,hi:s.hi});SAMEL[s.k]=l;}}   // 同じ列のつなぎ線が重ならないように、少しずつ左へずらす
  const DIFL={};{const de=E.filter(e=>pos[e.a]&&pos[e.b]&&pos[e.b].col>pos[e.a].col).map(e=>({k:e.a+'>'+e.b,a:e.a,c:pos[e.b].col,lo:Math.min(pos[e.a].row,pos[e.b].row),hi:Math.max(pos[e.a].row,pos[e.b].row)})).sort((a,b)=>a.lo-b.lo);const used={};for(const s of de){const L=used[s.c]=used[s.c]||[];const same=L.find(o=>o.a===s.a);let l=same?same.l:0;if(!same)while(L.some(o=>o.l===l&&o.a!==s.a&&!(o.hi<s.lo||o.lo>s.hi)))l++;L.push({l,a:s.a,lo:s.lo,hi:s.hi});DIFL[s.k]=Math.min(l,3);}}   // 別の親から同じ列に入る線は、縦の線を少しずつずらす（同じ親はまとめる）
  let paths='';for(const e of E){const q=pos[e.a],p=pos[e.b];if(!q||!p)continue;const x1=X(q.col)+W,y1=Y(q.row)+CH/2,x2=X(p.col),y2=Y(p.row)+CH/2;
    if(q.col===p.col){const x0=X(q.col),lane=(SAMEL[e.a+'>'+e.b]||0),xo=x0-6-lane*6;paths+=`<path class="${e.kind}" d="M${x0} ${y1} H${xo} V${y2} H${x0}"/>`;paths+=`<path class="hit" data-a="${e.a}" data-b="${e.b}" d="M${x0} ${y1} H${xo} V${y2} H${x0}"><title>押すとこの線を切る</title></path>`;}
    else if(x2>x1+12){const mx=x2-G/2+12-(DIFL[e.a+'>'+e.b]||0)*6;paths+=`<path class="${e.kind}" d="M${x1} ${y1} H${mx} V${y2} H${x2}"/>`;paths+=`<path class="hit" data-a="${e.a}" data-b="${e.b}" d="M${x1} ${y1} H${mx} V${y2} H${x2}"><title>押すとこの線を切る</title></path>`;}
    else{const ym=Y(Math.max(q.row,p.row))+CH+VG/2,xa=x1+G/3,xb=x2-G/3;paths+=`<path class="${e.kind}" d="M${x1} ${y1} H${xa} V${ym} H${xb} V${y2} H${x2}"/>`;paths+=`<path class="hit" data-a="${e.a}" data-b="${e.b}" d="M${x1} ${y1} H${xa} V${ym} H${xb} V${y2} H${x2}"><title>押すとこの線を切る</title></path>`;}}
  const w=X(maxCol+1)+W+12,h=Y(maxRow+3);
  $('tree').style.width=w+'px';$('tree').style.height=h+'px';
  $('tree').innerHTML=`<svg width="${w}" height="${h}">${paths}</svg>`+L.map(t=>cardHTML(t,pos[t.id])).join('');
  $('tree').querySelectorAll('[data-id]').forEach(bindCard);
  $('tree').querySelectorAll('path.hit').forEach(p=>p.onclick=e=>{e.stopPropagation();if(!canWrite)return;const a=p.dataset.a,bb=p.dataset.b,na=(nodeById[a]||{}).n||a,nb=(nodeById[bb]||{}).n||bb;
    if(confirm(`「${na}」→「${nb}」の線を切りますか？（あとで「線をつなぐ」でもどせます）`)){toggleLink(a,bb);$('msg').textContent=`線を切った：${na} → ${nb}`;}});
  const wn=AN.filter(t=>hasNote(t.id)).length;$('sum').innerHTML=`カード <b>${AN.filter(t=>!(t.kc&&!t.stage)).length}</b>・書き込み <b>${wn}</b>・動かした <b>${Object.keys(posO).length}</b>・足した <b>${Object.keys(custom).length}</b>`;}
// ドラッグで動かす・押して選ぶ・線をつなぐ
function bindCard(el){el.onpointerdown=ev=>{if(ev.button!==0||addMode)return;const id=el.dataset.id;const sx=ev.clientX,sy=ev.clientY,x0=parseFloat(el.style.left),y0=parseFloat(el.style.top);let drag=false;
  el.setPointerCapture(ev.pointerId);
  el.onpointermove=e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(!drag&&Math.hypot(dx,dy)>10&&!linkMode&&canWrite){drag=true;el.classList.add('drag');}if(drag){el.style.left=(x0+dx)+'px';el.style.top=(y0+dy)+'px';}};
  el.onpointerup=e=>{el.onpointermove=null;el.onpointerup=null;try{el.releasePointerCapture(ev.pointerId);}catch(_){}
    if(drag){const col=Math.max(C0(),Math.min(9,Math.round((parseFloat(el.style.left)-12)/(W+G))+C0())),row=Math.max(0,Math.round((parseFloat(el.style.top)-12)/(CH+VG)));
      let r=row;const taken=new Set(Object.entries(POS).filter(([k])=>k!==id).map(([k,v])=>v.col+':'+v.row));while(taken.has(col+':'+r))r++;
      posO[id]={cat:tab,col,row:r};render();put('pos',id,posO[id]);return;}
    clickCard(id);};};}
function clickCard(id){if(pickPre){const to=pickPre;pickPre=null;$('board').classList.remove('connect');if(id!==to&&!incoming(to).includes(id))toggleLink(id,to);
    $('msg').textContent='前提に足した：'+nodeById[id].n+' → '+nodeById[to].n;sel=to;render();renderDet();return;}
  if(linkMode){if(!linkSrc){linkSrc=id;$('msg').textContent='「'+nodeById[id].n+'」から → つなぐ先のカードを押してください（同じカードを押すとやめる）';render();return;}
    if(linkSrc===id){linkSrc=null;$('msg').textContent='線をつなぐ：前のカード → 後のカードの順に押す';render();return;}const a=nodeById[linkSrc].n,c=nodeById[id].n;const on=toggleLink(linkSrc,id);linkSrc=null;$('msg').textContent=(on?'つないだ：':'線を消した：')+a+' → '+c+'（続けて次の線も引けます。終わったら「線をつなぐ」をもう一度）';return;}
  sel=id;render();renderDet();}
function incoming(id){const t=nodeById[id];const out=[];for(const p of (t.pre||[])){const l=links[p+'>'+id];if(!(l&&l.on===false))out.push(p);}
  for(const v of Object.values(links))if(v.on&&v.to===id&&!out.includes(v.from))out.push(v.from);return out;}
let pickPre=null;
function toggleLink(a,b){const rv=links[b+'>'+a];if(rv&&rv.on){delete links[b+'>'+a];del('links',b+'__'+a);}const k=a+'>'+b,id=a+'__'+b;const t=nodeById[b];const def=t&&(t.pre||[]).includes(a);const cur=links[k];let on;
  if(def){if(cur&&cur.on===false){delete links[k];del('links',id);on=true;}else{links[k]={from:a,to:b,on:false};put('links',id,links[k]);on=false;}}
  else{if(cur&&cur.on){delete links[k];del('links',id);on=false;}else{links[k]={from:a,to:b,on:true};put('links',id,links[k]);on=true;}}
  render();return on;}
function renderDet(){const t=nodeById[sel];if(!t)return;const n=notes[t.id]||{};const st=n.st||'';const p=POS[t.id];
  const opts=t.prop||t.custom?['adopt','change','reject']:['keep','change','drop'];
  $('det').style.setProperty('--tc',TC[t.cat]);
  const pres=(t.pre||[]).map(q=>nodeById[q]?nodeById[q].n:q);
  const left=t.custom?`<div><label class="hint" for="cn">名前</label><input type="text" id="cn" value="${esc(t.n)}">
      <label class="hint" for="ce" style="display:block;margin-top:6px">効果</label><textarea id="ce" style="min-height:52px">${esc(t.e)}</textarea>
      <div class="row">ランク：<b>${p?RN[p.col]||p.col:RN[t.r]}</b>（カードを動かすと変わる）</div>__PRE__<button class="del" id="cdel">このカードを消す</button></div>`
   :`<div><h2>${t.ic&&D.IC[t.ic]?`<img class="ic2" src="${D.IC[t.ic]}" alt="">`:''}${esc(t.n)}</h2><div class="meta">${(D.TABL&&D.TABL[t.cat])||t.cat}・ランク${RN[t.r]}${p&&p.col!==t.r?` <span class="moved">→ ランク${RN[p.col]||p.col}に動かした</span>`:''}${t.prop?`・${t.prop}（${esc(t.tg)}）`:''}${t.stage?'・改築の段':''}</div>
    <div class="ef">${esc(t.e)}</div>
    __PRE__${t.by?`<div class="row">解放する研究：<b>${esc(t.by)}</b></div>`:''}${t.c?`<div class="row">費用：<b>${esc(t.c)}</b>・${t.tt}ターン</div>`:''}
    ${t.un&&t.un.length?`<div class="row">解放：<b>${t.un.map(esc).join('・')}</b></div>`:''}${t.mv?`<div class="row">魔核タブをなくすときの引っ越し先：<b>${esc(t.mv)}</b></div>`:''}${t.art?'<div class="row" style="color:var(--red)">新しい絵が必要</div>':''}
    ${posO[t.id]?'<button class="del" id="pback" style="color:var(--dim);border-color:var(--frame)">位置を元に戻す</button>':''}</div>`;
  const inc=incoming(t.id);const preHTML=`<div class="row">前提：${inc.length?inc.map(q=>`<span class="pre1"><b>${esc(nodeById[q]?nodeById[q].n:q)}</b><button data-unpre="${q}" title="この前提を外す">×</button></span>`).join(''):'<span style="color:var(--dim)">なし</span>'}
    <button class="addpre" id="addpre">＋ 前提を足す</button></div>`;
  $('det').innerHTML=left.replace('__PRE__',preHTML)+`<div><div class="st">${opts.map(k=>`<button data-st="${k}" class="${st===k?'on':''}" style="--stc:${STX[k][1]}">${STX[k][0]}</button>`).join('')}</div>
    <label for="memo" class="hint" style="display:block;margin-top:8px">メモ（変え方・気になること）</label>
    <textarea id="memo" placeholder="例：射程も伸ばしたい／ランクⅣに移したい">${esc(n.note||'')}</textarea>
    ${canWrite?'':'<div class="ro">この画面からは書き込めません（閲覧のみ）</div>'}</div>`;
  $('det').querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{const k=b.dataset.st;notes[t.id]=Object.assign({},notes[t.id],{st:st===k?'':k});putNote(t.id);render();renderDet();});
  deb($('memo'),v=>{notes[t.id]=Object.assign({},notes[t.id],{note:v});putNote(t.id);render();});
  if(t.custom){deb($('cn'),v=>{custom[t.id]=Object.assign({},custom[t.id],{n:v});put('custom',t.id,custom[t.id]);render();});
    deb($('ce'),v=>{custom[t.id]=Object.assign({},custom[t.id],{e:v});put('custom',t.id,custom[t.id]);render();});
    $('cdel').onclick=()=>{delete custom[t.id];del('custom',t.id);if(posO[t.id]){delete posO[t.id];del('pos',t.id);}for(const [k,v] of Object.entries(links))if(v.from===t.id||v.to===t.id){delete links[k];del('links',v.from+'__'+v.to);}
      sel=null;$('det').innerHTML='<div class="empty">消しました。</div>';render();};}
  $('det').querySelectorAll('[data-unpre]').forEach(x=>x.onclick=()=>{toggleLink(x.dataset.unpre,t.id);renderDet();});
  $('addpre').onclick=()=>{pickPre=t.id;$('board').classList.add('connect');$('msg').textContent='「'+t.n+'」の前提にするカードを押してください（Escでやめる）';};
  const pb=$('pback');if(pb)pb.onclick=()=>{delete posO[t.id];del('pos',t.id);render();renderDet();};
  if(!canWrite)$('det').querySelectorAll('button,textarea,input').forEach(x=>x.disabled=true);}
function deb(el,fn){if(!el)return;let tm=null;el.oninput=()=>{clearTimeout(tm);setSave('入力中…','');tm=setTimeout(()=>fn(el.value),800);};el.onblur=()=>{clearTimeout(tm);fn(el.value);};}
function setSave(txt,cls){const e=$('save');e.textContent=txt;e.className='save '+(cls||'');}
// 保存（同じ文書は1つずつ）
const busy={},again={};
async function put(col,id,data){const key=col+'/'+id;if(!db){setSave('保存できません（つながっていない）','bad');return;}
  if(busy[key]){again[key]=()=>put(col,id,data);return;}busy[key]=true;setSave('保存中…','');
  try{await db.collection(col).doc(id).set(Object.assign({},data,{at:new Date().toISOString()}));setSave('保存しました','ok');}
  catch(e){if(e&&e.code==='invalid_argument'){canWrite=false;setSave('書き込みできません','bad');}else setSave('保存できませんでした','bad');}
  busy[key]=false;if(again[key]){const f=again[key];again[key]=null;f();}}
async function del(col,id){if(!db)return;try{await db.collection(col).doc(id).delete();setSave('保存しました','ok');}catch(e){setSave('保存できませんでした','bad');}}
function putNote(id){const t=nodeById[id],n=notes[id]||{};put('notes',id,{st:n.st||'',note:n.note||'',name:t?t.n:'',cat:t?t.cat:'',rank:t?t.r:0,prop:(t&&t.prop)||''});}
$('tools').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filt=b.dataset.f;$('tools').querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===b));render();});
$('kcTg').onclick=()=>{showKc=!showKc;$('kcTg').classList.toggle('on',showKc);render();};
$('linkBtn').onclick=()=>{linkMode=!linkMode;linkSrc=null;$('linkBtn').classList.toggle('on',linkMode);$('board').classList.toggle('connect',linkMode);
  $('msg').textContent=linkMode?'線をつなぐ：前のカード → 後のカードの順に押す（もとからある線を押すと消える。もう一度で戻る）':'カードはドラッグで動かせます（列を動かすと、取れるランクが変わる）';render();};
let addMode=false;
function setAdd(on){addMode=on;$('addBtn').classList.toggle('on',on);$('board').classList.toggle('adding',on);const g=$('ghost');if(g)g.style.display='none';
  $('msg').textContent=on?'足したい場所（空いているところ）を押してください（Escでやめる）':'カードはドラッグで動かせます（列を動かすと、取れるランクが変わる）';}
function cellAt(ev){const r=$('tree').getBoundingClientRect();const x=ev.clientX-r.left,y=ev.clientY-r.top;
  return {col:Math.max(C0(),Math.min(9,Math.floor((x-12)/(W+G))+C0())),row:Math.max(0,Math.floor((y-12)/(CH+VG)))};}
$('addBtn').onclick=()=>{if(!canWrite)return;if(linkMode)$('linkBtn').click();setAdd(!addMode);};
$('tree').addEventListener('pointermove',ev=>{if(!addMode)return;let g=$('ghost');if(!g){g=document.createElement('div');g.id='ghost';$('tree').appendChild(g);}
  const c=cellAt(ev);const busy=Object.values(POS).some(p=>p.col===c.col&&p.row===c.row);g.className=busy?'busy':'';
  g.style.cssText=`display:block;left:${12+(c.col-C0())*(W+G)}px;top:${12+c.row*(CH+VG)}px;width:${W}px;height:${CH}px`;g.textContent=busy?'ここは使われています':'ここに足す（ランク'+(RN[c.col]||c.col)+'）';});
$('tree').addEventListener('click',ev=>{if(!addMode)return;ev.stopPropagation();const c=cellAt(ev);
  if(Object.values(POS).some(p=>p.col===c.col&&p.row===c.row))return;
  const id='c'+Date.now().toString(36);custom[id]={cat:tab,r:c.col,n:'新しい研究',e:''};posO[id]={cat:tab,col:c.col,row:c.row};setAdd(false);
  put('custom',id,custom[id]).then(()=>put('pos',id,posO[id]));sel=id;render();renderDet();const ci=$('cn');if(ci){ci.focus();ci.select();}},true);
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(addMode){setAdd(false);return;}if(pickPre){pickPre=null;$('board').classList.remove('connect');$('msg').textContent='やめました';}else if(linkMode){$('linkBtn').click();}});
render();
(async()=>{let to=setTimeout(()=>setSave('保存先につながりません','bad'),10000);
  try{db=window.claude&&await window.claude.use('db');}catch(e){db=null;}
  if(!db){clearTimeout(to);setSave('書き込みは保存されません（この画面では保存先が使えない）','bad');return;}
  const typing=()=>{const a=document.activeElement;return !!(a&&$('det').contains(a)&&/^(TEXTAREA|INPUT)$/.test(a.tagName));};
  const sub=(col,fn)=>db.collection(col).onSnapshot(s=>{if(!s.metadata.fromCache)clearTimeout(to);fn(s);render();if(sel&&nodeById[sel]&&!typing())renderDet();},e=>{clearTimeout(to);setSave('保存先につながりません','bad');});
  sub('notes',s=>{for(const d of s.docs){const v=d.data();if(!v||busy['notes/'+d.id])continue;if(sel===d.id&&typing())continue;notes[d.id]=v;}});
  sub('pos',s=>{const seen=new Set();for(const d of s.docs){const v=d.data();if(!v)continue;seen.add(d.id);if(!busy['pos/'+d.id])posO[d.id]=v;}for(const k of Object.keys(posO))if(!seen.has(k)&&!busy['pos/'+k])delete posO[k];});
  sub('links',s=>{const nl={};for(const d of s.docs){const v=d.data();if(v)nl[v.from+'>'+v.to]=v;}for(const k of Object.keys(links))delete links[k];Object.assign(links,nl);});
  sub('custom',s=>{const seen=new Set();for(const d of s.docs){const v=d.data();if(!v)continue;seen.add(d.id);if(sel===d.id&&typing())continue;custom[d.id]=v;}for(const k of Object.keys(custom))if(!seen.has(k)&&!busy['custom/'+k])delete custom[k];});
})();
})();
</script>
