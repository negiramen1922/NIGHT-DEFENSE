<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ナイトディフェンス — シミュレーション型ディフェンスゲーム</title>
<meta name="description" content="ナイトディフェンス：木材や石材、食料と住居を整え、兵士と防衛施設で夜ごとに押し寄せる魔物から街を守る、ドット絵のシミュレーション型ディフェンスゲーム。ブラウザですぐ遊べます。">
<meta name="theme-color" content="#0b0f0c">
<meta property="og:type" content="website">
<meta property="og:title" content="ナイトディフェンス — シミュレーション型ディフェンスゲーム">
<meta property="og:description" content="街を育て、守りを固め、夜ごとの襲撃をしのぐドット絵のディフェンスゲーム。ブラウザですぐ遊べます。">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%230b0f0c'/%3E%3Cpath d='M9 2h3v1h1v1h1v3h1v3h-1v2h-1v1h-2v1H7v-1H5v-1H4v-1h3v-1h2V9h1V7h1V5h-1V3H9z' fill='%23f2b33d'/%3E%3Crect x='3' y='3' width='1' height='1' fill='%23fff3b0'/%3E%3Crect x='5' y='6' width='1' height='1' fill='%23fff3b0'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b0f0c; --panel:#121a14; --line:#2a3a2d; --text:#cfe3cf; --dim:#7f9a82;
  --amber:#f2b33d; --red:#ff5a4e; --green:#6fe08a; --cyan:#62c6d9; --mat:#d48cff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;font-size:13px}
html,body{height:100%}
body{overflow:hidden}
#wrap{display:flex;gap:10px;padding:10px;max-width:1340px;margin:0 auto;align-items:stretch;height:100vh}
#left{flex:1;min-width:0;display:flex;flex-direction:column;overflow-y:auto;height:100%}
#right>*,#left>*{flex-shrink:0}
.logbox{flex:1 1 auto!important;min-height:150px;display:flex;flex-direction:column}
.logbox #log{flex:1;height:auto;min-height:100px}
::-webkit-scrollbar{width:9px}::-webkit-scrollbar-track{background:#0b0f0c}::-webkit-scrollbar-thumb{background:#2a3a2d;border-radius:4px}::-webkit-scrollbar-thumb:hover{background:#3a4d40}
*{scrollbar-color:#2a3a2d #0b0f0c}
#topbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:6px 10px;margin-bottom:6px}
.res{display:flex;gap:4px;align-items:baseline}
.res b{font-size:15px;font-variant-numeric:tabular-nums}
.res span{color:var(--dim);font-size:11px}
.res .dl{font-size:10px;margin-left:2px}
.ic{vertical-align:-2px;margin-right:2px;flex-shrink:0}
.cst{white-space:nowrap}
#econ .rrow{display:grid;grid-template-columns:18px 64px 52px 1fr;align-items:center;gap:2px}
#econ{font-size:12px;line-height:1.55}
#econ .er{display:flex;justify-content:space-between}
#econ .gd{color:var(--green)}#econ .wn{color:var(--amber)}#econ .bd{color:var(--red)}
.ebar{height:6px;background:#1a221c;margin:3px 0;position:relative}.ebar i{display:block;height:100%}.ebar b{position:absolute;top:-2px;width:2px;height:10px;background:#cfe3cf}
#wave{margin-left:auto;color:var(--amber);font-weight:bold}
#intel{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--red);padding:5px 10px;margin-bottom:6px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:12px;min-height:30px}
#intel .lbl{color:var(--red);font-weight:bold;letter-spacing:.1em}
#intel .ec{display:flex;gap:4px;align-items:center}
#intel .dot{width:9px;height:9px;display:inline-block}
canvas{width:100%;display:block;border:1px solid var(--line);background:#070a08;cursor:crosshair;touch-action:none}
#report{font-size:13px;line-height:1.8}
#report .rt{color:var(--cyan);font-weight:bold;letter-spacing:.1em;margin-right:8px}
#report .gd{color:var(--green)}#report .wn{color:var(--amber)}#report .bd{color:var(--red)}
#report .grid{display:flex;flex-wrap:wrap;gap:4px 16px}
#controls{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
#right{width:340px;flex-shrink:0;display:flex;flex-direction:column;gap:8px;overflow-y:auto;height:100%;padding-right:3px}
.box{background:var(--panel);border:1px solid var(--line);padding:8px}
.box h3{cursor:pointer;user-select:none;display:flex;justify-content:space-between;align-items:center}
.box h3::after{content:'▾';color:var(--dim);font-size:11px}
.box.closed h3{margin-bottom:0;border-bottom:none;padding-bottom:0}
.box.closed h3::after{content:'▸'}
.box.closed>:not(h3){display:none!important}
.box.closed{min-height:0!important}
.box h3:hover{color:#ffd07a}
.box h3{margin:0 0 6px;font-size:12px;color:var(--amber);letter-spacing:.1em;border-bottom:1px solid var(--line);padding-bottom:4px}
button{background:#18241b;color:var(--text);border:1px solid var(--line);padding:5px 8px;font:inherit;cursor:pointer}
button:hover:not(:disabled){border-color:var(--amber);color:var(--amber)}
button:disabled{opacity:.4;cursor:not-allowed}
button.na{opacity:.45}
#build button .bic{float:left;margin:1px 6px 0 0;line-height:0}button.na.on{opacity:.8}
button.on{border-color:var(--amber);background:#2a2412;color:var(--amber)}
#build .bg{display:grid;grid-template-columns:1fr 1fr;gap:4px}
#build .bh{font-size:11px;color:var(--cyan);letter-spacing:.15em;margin:6px 0 4px;cursor:pointer;user-select:none;display:flex;justify-content:space-between;border-bottom:1px dashed var(--line)}
#build .bh:first-child{margin-top:0}
#build .bh::after{content:'▾';color:var(--dim)}
#build .bh.closed::after{content:'▸'}
#build .bh.closed+.bg{display:none}
#build .bh:hover{color:#9fe8ff}
#build button{text-align:left;padding:4px 6px;line-height:1.3}
#build button small{display:block;color:var(--dim);font-size:10px}
#info{min-height:120px}
.row{display:flex;justify-content:space-between;margin:2px 0}
.muted{color:var(--dim)}
select{background:#0e1510;color:var(--text);border:1px solid var(--line);font:inherit;padding:3px;width:100%}
.cmd{border:1px solid var(--line);padding:5px;margin-bottom:4px}
#cmds .cmd{cursor:pointer}
#cmds .cmd:hover{border-color:var(--dim)}
#cmds .cmd.sel{border-color:var(--amber)}
.cmd .t{display:flex;justify-content:space-between}
.spec{font-size:11px;padding:0 4px;border:1px solid}
.xpbar{height:3px;background:#223;margin-top:3px}.xpbar i{display:block;height:100%;background:var(--cyan)}
#log{height:170px;overflow-y:auto;font-size:11px;line-height:1.5}
#log .kia{color:var(--red)} #log .good{color:var(--green)} #log .warn{color:var(--amber)}
#overlay.home{background:radial-gradient(ellipse at 50% 30%,#1a2238 0%,#0a0d18 55%,#050608 100%)!important}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:20;touch-action:pan-y}
#overlay .card{background:var(--panel);border:1px solid var(--amber);padding:20px 24px;max-width:540px;width:92%;max-height:88vh;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
body.ov #left,body.ov #right{overflow:hidden!important}
.howto summary{cursor:pointer;color:var(--amber);font-weight:bold;padding:6px 0;user-select:none}
@media (max-width:900px){#overlay .card{padding:14px 14px;width:96%}#overlay{z-index:20}}
#overlay .card.wide{max-width:1080px}
#overlay h2{color:var(--amber);margin-top:0}
.help{color:var(--dim);font-size:11px;line-height:1.6}
.rcols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:800px){.rcols{grid-template-columns:1fr}}
.rcol h4{margin:0 0 6px;font-size:12px;letter-spacing:.1em}
.tier{font-size:10px;color:var(--dim);margin:8px 0 3px;letter-spacing:.2em;border-bottom:1px dashed var(--line)}
.tech{border:1px solid var(--line);padding:5px 6px;margin-bottom:4px;font-size:12px}
.tech .tt{display:flex;justify-content:space-between;align-items:baseline}
.tech .eff{color:var(--dim);font-size:11px;margin:2px 0 3px}
.tech .meta{font-size:11px;display:flex;justify-content:space-between;align-items:center;gap:4px}
.tech.done{border-color:#2f5a37;background:#0f1d12}
.tech.active{border-color:var(--cyan)}
.tech.locked{opacity:.4}
.tech.excl{border-style:dashed}
.tech.key{box-shadow:inset 3px 0 0 var(--amber)}
.ttabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.tree{overflow:auto;max-height:52vh;border:1px solid var(--line);background:#0a0e0b}
.tnode{position:absolute;width:178px;height:72px;border:1px solid #2f3f33;background:#121a14;padding:5px 7px;font-size:11.5px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;line-height:1.35}
.tnode:hover{border-color:var(--dim)}
.tnode.ready{border-color:#5b6d5e;background:#141f17}
.tnode.done{border-color:#2f5a37;background:#0f1d12}
.tnode.active{border-color:var(--cyan)}
.tnode.locked,.tnode.excluded{opacity:.45}
.tnode.excl{border-style:dashed}
.tnode.key{box-shadow:inset 3px 0 0 var(--amber)}
.tnode.sel{outline:2px solid var(--amber);outline-offset:1px;opacity:1}
.tdet{border:1px solid var(--line);background:#0e1510;padding:8px 10px;margin-top:6px;font-size:12.5px}
.tbar{height:3px;background:#223;margin-top:4px}.tbar i{display:block;height:100%;background:var(--cyan)}
.kbd{border:1px solid var(--line);padding:0 4px;color:var(--text)}
.cands{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:700px){.cands{grid-template-columns:1fr}}
.cand{border:1px solid var(--line);padding:8px;font-size:12px}
.upg{border:1px solid var(--line);padding:6px;margin-top:8px;background:#0e1510}
.pips{color:var(--amber);letter-spacing:2px}
#sheetHandle{display:none}
#modeBar{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);padding:4px 8px;margin-bottom:4px;font-size:12px;min-height:34px;flex-wrap:wrap}
#modeBar .seg{display:flex;border:1px solid var(--line)}
#modeBar .seg button{border:none;padding:4px 12px;font-weight:bold}
#modeBar .seg button.on{background:var(--amber);color:#111}
#modeBar.build{border-color:var(--amber);background:#2a2412;box-shadow:0 0 0 1px #f2b33d55 inset}
#modeBar #modeTxt{flex:1;min-width:160px}
#modeBar #mExit{display:none}#modeBar.build #mExit{display:inline-block}
body.building canvas#cv{cursor:cell;outline:2px solid #f2b33d88;outline-offset:-2px}
body.fullmap #modeBar{position:fixed;left:6px;right:6px;z-index:7;margin:0;background:rgba(18,26,20,.86)}
body.fullmap #modeBar.build{background:rgba(42,36,18,.92)}
@media (max-width:900px){#modeBar{font-size:11.5px;padding:3px 5px;gap:5px}#modeBar .seg button{padding:4px 9px}body.fullmap #modeBar{left:4px;right:4px}}
/* マップ全画面 */
body.fullmap #wrap{padding:0;max-width:none}
body.fullmap #left{position:fixed;inset:0;z-index:5;overflow:hidden;padding:0}
body.fullmap canvas#cv{position:fixed;left:0;top:0;width:100vw;height:100vh;border:none;z-index:5}
body.fullmap #topbar{position:fixed;top:6px;left:6px;right:6px;z-index:7;background:rgba(18,26,20,.82);backdrop-filter:blur(3px);margin:0}
body.fullmap #intel{position:fixed;top:52px;left:6px;right:6px;z-index:7;background:rgba(18,26,20,.78);margin:0}
body.fullmap #controls{position:fixed;left:6px;bottom:6px;z-index:7;background:rgba(18,26,20,.82);padding:5px;border:1px solid var(--line);margin:0;max-width:calc(100vw - 230px)}
body.fullmap #controls .help,body.fullmap .logbox{display:none!important}
body.fullmap #bFull{order:-1}
body.fullmap #right{position:fixed;top:0;right:0;bottom:0;width:340px;z-index:8;background:rgba(11,15,12,.96);padding:8px;transform:translateX(100%);transition:transform .25s;height:auto;box-shadow:-6px 0 20px #000a}
body.fullmap #right.open{transform:none}
@media (max-width:900px){
  body.fullmap #topbar{top:4px;left:4px;right:4px;padding:3px 6px}
  body.fullmap #intel{display:none}
  body.fullmap #controls{bottom:42px;left:4px;right:4px;max-width:none;flex-wrap:nowrap;overflow-x:auto}
  body.fullmap #controls button{flex-shrink:0}
  body.fullmap #right{width:100%;top:auto;height:58vh;transform:translateY(calc(100% - 38px))}
  body.fullmap #right.open{transform:none}
}
@media (max-width:900px){
  #wrap{flex-direction:column;height:100vh;padding:4px;gap:4px}
  #left{height:100%;overflow-y:auto;padding-bottom:44px}
  #topbar{gap:8px;padding:4px 6px}.res b{font-size:13px}
  #controls button{padding:4px 6px;font-size:12px}
  #controls .help{display:none}
  .logbox{flex:0 0 auto!important;min-height:0}.logbox #log{height:110px;flex:none}
  #right{position:fixed;left:0;right:0;bottom:0;width:100%;height:58vh;background:var(--bg);border-top:2px solid var(--amber);z-index:6;
    transform:translateY(calc(100% - 38px));transition:transform .25s;padding:0 6px 10px;overflow-y:auto;box-shadow:0 -6px 20px #000a}
  #right.open{transform:none}
  #sheetHandle{display:flex;justify-content:center;align-items:center;gap:8px;position:sticky;top:0;z-index:2;background:var(--bg);height:38px;color:var(--amber);font-weight:bold;cursor:pointer;user-select:none;border-bottom:1px solid var(--line);flex-shrink:0}
  #sheetHandle::before{content:'';width:40px;height:4px;border-radius:2px;background:#4a5a4d;position:absolute;top:5px}
}
/* 立ち絵 */
.art{display:block;width:100%;height:auto;border:1px solid var(--line);margin-bottom:6px;background:#060a07}
.art text{font-family:inherit}
@keyframes smk{0%{transform:translate(0,0) scale(1);opacity:.5}100%{transform:translate(8px,-36px) scale(2.6);opacity:0}}
.sm{animation:smk 3s linear infinite;transform-box:fill-box;transform-origin:center}
.d1{animation-delay:-1s!important}.d2{animation-delay:-2s!important}.d3{animation-delay:-.5s!important}
@keyframes blk{0%,100%{opacity:1}50%{opacity:.15}}
.bl{animation:blk 1.6s steps(2) infinite}
@keyframes spn{to{transform:rotate(360deg)}}
.sp{animation:spn 4s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes pls{0%,100%{opacity:.35}50%{opacity:1}}
.pl{animation:pls 2s ease-in-out infinite}
@keyframes conv{from{transform:translateX(0)}to{transform:translateX(24px)}}
.cv{animation:conv 1.4s linear infinite}
@keyframes swp{0%,100%{transform:rotate(-28deg)}50%{transform:rotate(28deg)}}
.swp{animation:swp 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes rcl{0%,78%,100%{transform:translateX(0)}82%{transform:translateX(-7px)}}
.rc{animation:rcl 4.5s infinite}
@keyframes rng{0%{transform:scale(.1);opacity:.9}100%{transform:scale(1);opacity:0}}
.rg{animation:rng 2.2s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes crn{0%,100%{transform:translateX(0)}50%{transform:translateX(70px)}}
.cr{animation:crn 8s ease-in-out infinite}
@keyframes rdr{0%,100%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
.rd{animation:rdr 3s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.bob{animation:bob 1.1s ease-in-out infinite}
@keyframes flk{0%,100%{opacity:0}4%{opacity:1}8%{opacity:0}}
.fl{animation:flk .9s infinite}
@keyframes mrch{from{transform:translateX(0)}to{transform:translateX(60px)}}
.mr{animation:mrch 6s linear infinite}
.more{display:inline-block;position:relative}
.more>summary{list-style:none;cursor:pointer;background:#18241b;border:1px solid var(--line);padding:5px 8px;user-select:none}
.more>summary::-webkit-details-marker{display:none}
.more[open]>summary{border-color:var(--amber);color:var(--amber)}
.moreBody{position:absolute;bottom:calc(100% + 4px);right:0;z-index:30;background:var(--panel);border:1px solid var(--amber);padding:8px;display:flex;flex-direction:column;gap:5px;width:270px;box-shadow:0 4px 18px #000a}
.moreBody button{text-align:left}
.hp{color:var(--text);font-size:13px;line-height:1.65;max-width:820px;margin:0 auto}
.hp section{border-top:1px solid var(--line);padding:8px 0 4px}
.hp h3{margin:2px 0 6px;color:var(--amber);font-size:15px}
.hp p{margin:4px 0}
.hpI{display:inline-flex;align-items:center;gap:3px;background:#1a1610;border:1px solid #4a3d22;padding:0 5px 0 2px;margin:0 2px;vertical-align:middle;white-space:nowrap}
.hpI em{font-style:normal;font-weight:bold}
.hpK{display:inline-block;background:#2a2412;border:1px solid var(--amber);color:#ffe2a0;padding:0 6px;font-size:12px;margin:0 2px;white-space:nowrap}
.hpGrid{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;margin:6px 0}
.hpGrid>div{background:#14120d;border-left:3px solid #5a4a2a;padding:3px 6px}
.hpFlow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0}
.hpFlow>div{background:#14120d;border:1px solid #5a4a2a;padding:4px 8px;text-align:center}
.hpFlow small{display:block;color:var(--dim,#9a8f78);font-size:11px}
.hpFlow i{color:var(--amber);font-style:normal;font-weight:bold}
.hpNote{color:#e8a0a0;font-size:12px}
@media (max-width:700px){.hpGrid{grid-template-columns:1fr}}
.moreBody .help{max-width:250px;white-space:normal}
#rtabs{display:flex;margin-bottom:6px;border:1px solid var(--line)}
#rtabs button{flex:1;border:none;border-right:1px solid var(--line);padding:6px 4px}
#rtabs button:last-child{border-right:none}
#rtabs button.on{background:#2a2412;color:var(--amber)}
.rgp{display:flex;gap:10px;align-items:baseline;padding-right:10px;border-right:1px solid var(--line)}
.rgp:last-child{border-right:none}
.tnode.maplock{opacity:.35}
/* ===== UI整理：PCでは画面の高さに収める ===== */
@media (min-width:901px){
  body:not(.fullmap) #left{overflow:hidden}
  body:not(.fullmap) .logbox{flex:1 1 60px!important;min-height:60px;overflow:hidden}
  body:not(.fullmap) .logbox #log{min-height:0;height:auto}
  body:not(.fullmap) #right{overflow:hidden;gap:6px}
  body:not(.fullmap) #info{flex:0 1 auto;max-height:58vh;overflow-y:auto}
  body:not(.fullmap) #rtabs{flex-shrink:0;margin-bottom:0}
  body:not(.fullmap) #right .box[data-rt]{flex:1 1 0;min-height:80px;overflow-y:auto}
  body:not(.fullmap) #right .box[data-rt="res"]{flex:1 1 0}
  #info .art{max-height:92px;width:auto;max-width:100%;margin:0 auto 6px}
  #topbar{padding:5px 10px}
  #controls{margin-top:4px}
  #controls button{padding:4px 8px}
  #bNext{font-weight:bold;padding:5px 14px!important}
}

/* ===== 初心者タスク ===== */
#guide{position:fixed;z-index:8;width:330px;max-width:calc(100vw - 16px);background:rgba(20,17,12,.94);border:1px solid #c8a070;box-shadow:0 4px 16px #000a;font-size:12px;color:var(--text);display:none}
#guide.min{width:auto}
#guide .gh{display:flex;align-items:center;gap:6px;padding:4px 6px;background:#2a2014;border-bottom:1px solid #5a4a2a;cursor:pointer;user-select:none}
#guide .gh b{color:#e8c070;flex:1}
#guide .gh .gp{font-size:11px;color:#c8b890}
#guide.min .gb{display:none}
#guide .gb{padding:5px 7px;max-height:42vh;overflow-y:auto}
#guide .gs{border-left:3px solid #8a6a3a;padding:3px 6px;margin:4px 0;background:#17140e}
#guide .gs.done{border-color:var(--green);opacity:.75}
#guide .gs .gt{display:flex;align-items:center;gap:5px;font-weight:bold;color:#ffe2a0}
#guide .gs .gt .tr{font-size:10px;color:#111;background:#c8a070;padding:0 4px;font-weight:bold}
#guide .gs .gt .tr.def{background:#d97a5a}
#guide .gs .gd{color:#cfc4a8;margin:2px 0;line-height:1.5}
#guide .gbar{height:4px;background:#2a2418;margin:3px 0}
#guide .gbar i{display:block;height:100%;background:#e8b050}
#guide .grow{display:flex;align-items:center;gap:6px;justify-content:space-between}

// 地形生成のルール
//  ・各襲撃方面の出現地点から城館までの帯（幅±3マス）＝進攻路には岩場・湿地を置かない
//  ・岩場は城館から8マス以上離す。尾根は短めで数を制限
//  ・高地は城館の近く（3〜13マス）、森林は中距離、湿地は遠方
//  ・油田は3か所：近場（7〜10）、中距離（11〜15）、遠方（14〜19）。進攻路からは外す
//  ・最後に、外周から城館へ必ず通れることを確認し、塞がっていれば岩を崩す
function spawnPoint(side,lane){return side==='E'?[COLS-1,lane*ROWS]:side==='W'?[0,lane*ROWS]:side==='N'?[lane*COLS,0]:[lane*COLS,ROWS-1];}
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay;const t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy)));return Math.hypot(px-(ax+dx*t),py-(ay+dy*t));}
function genTerrain(sides,lanes){
  const t=[];for(let y=0;y<ROWS;y++)t.push(new Array(COLS).fill(0));
  const oil=[];for(let y=0;y<ROWS;y++)oil.push(new Array(COLS).fill(false));
  const corr=(x,y)=>{let m=99;for(const sd of sides){const[ax,ay]=spawnPoint(sd,lanes[sd]);m=Math.min(m,segDist(x,y,ax,ay,HQX,HQY));}return m;};
  const R=Math.random;const far=(x,y,m)=>Math.hypot(x-HQX,(y-HQY)*1.3)>m;
  const blob=(cx,cy,r,v,minD)=>{for(let y=Math.floor(cy-r-1);y<=cy+r+1;y++)for(let x=Math.floor(cx-r-1);x<=cx+r+1;x++){
    if(x<0||y<0||x>=COLS||y>=ROWS)continue;if(Math.hypot(x-cx,y-cy)+R()*0.8<=r&&far(x,y,minD))t[y][x]=v;}};
  const ring=(dmin,dmax)=>{const a=R()*Math.PI*2,d=dmin+R()*(dmax-dmin);return[HQX+Math.cos(a)*d*1.3,HQY+Math.sin(a)*d*0.85];};
  for(let i=0;i<9;i++){const[x,y]=ring(6,20);blob(x,y,1.8+R()*1.6,2,4);}         // 森林
  for(let i=0;i<5;i++){const[x,y]=ring(10,22);if(corr(x,y)<4.5)continue;blob(x,y,2+R()*1.6,4,8);}        // 湿地（大きめにして中心を沼に）
  for(let i=0;i<7;i++){const[x,y]=ring(3,14);blob(x,y,1.2+R()*1.3,1,2.5);}       // 高地
  for(let i=0;i<7;i++){                                                          // 岩場の尾根
    let[x,y]=ring(10,21);let a=R()*Math.PI*2;const len=4+Math.floor(R()*7);
    for(let k=0;k<len;k++){const gx=Math.round(x),gy=Math.round(y);
      if(gx>=0&&gy>=0&&gx<COLS&&gy<ROWS&&far(gx,gy,8)&&corr(gx,gy)>3){t[gy][gx]=3;if(R()<0.35&&gy+1<ROWS&&far(gx,gy+1,8)&&corr(gx,gy+1)>3)t[gy+1][gx]=3;}
      a+=(R()-.5)*0.9;x+=Math.cos(a);y+=Math.sin(a);}
  }
  // 進攻路の湿地は消す
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(t[y][x]===4&&corr(x,y)<3)t[y][x]=0;
  // 油田
  for(const [dmin,dmax] of [[7,10],[11,15],[14,19]]){
    let cx=0,cy=0;for(let k=0;k<40;k++){[cx,cy]=ring(dmin,dmax);cx=Math.round(cx);cy=Math.round(cy);if(cx>1&&cy>1&&cx<COLS-2&&cy<ROWS-2&&corr(cx,cy)>3.5)break;}
    for(let k=0;k<6;k++){const x=cx+Math.floor(R()*3-1),y=cy+Math.floor(R()*3-1);if(x>=0&&y>=0&&x<COLS&&y<ROWS){oil[y][x]=true;t[y][x]=0;}}
  }
  // 外周から城館まで必ず通れるようにする
  const reach=()=>{const seen=new Uint8Array(COLS*ROWS);const q=[HQY*COLS+HQX];seen[q[0]]=1;
    while(q.length){const i=q.pop(),x=i%COLS,y=(i/COLS)|0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=COLS||ny>=ROWS)continue;const j=ny*COLS+nx;if(!seen[j]&&t[ny][nx]!==3){seen[j]=1;q.push(j);}}}return seen;};
  const seen=reach();
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(t[y][x]!==3&&!seen[y*COLS+x]){
    // 閉じ込められた所は城館へ向けて岩を崩す
    let cx=x,cy=y;while(Math.abs(cx-HQX)+Math.abs(cy-HQY)>0){if(t[cy][cx]===3)t[cy][cx]=0;if(Math.abs(cx-HQX)>Math.abs(cy-HQY))cx+=Math.sign(HQX-cx);else cy+=Math.sign(HQY-cy);}
  }
  return{t,oil};
}
// ===== 作戦マップ「第7防衛区域」（固定・96×64） =====
// 西寄りに城館。北・中央・南の3本の山脈が峠を作り、東は海岸と入り江。川が南北に流れ、浅瀬で渡れる。
// 敵の巣（アビス）は北α・北東β・南東γの3か所。波が進むごとに襲撃元が増える。
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function genCampaign(mapId){
  const R=mulberry(mapId==='2'?2231:7714);
  const t=[],oil=[],ore=[];for(let y=0;y<ROWS;y++){t.push(new Array(COLS).fill(0));oil.push(new Array(COLS).fill(false));ore.push(new Array(COLS).fill(false));}

}

  const line=(pts,v,th,gaps)=>{for(let i=0;i<pts.length-1;i++){const[ax,ay]=pts[i],[bx,by]=pts[i+1];const n=Math.ceil(Math.hypot(bx-ax,by-ay)*2);
    for(let k=0;k<=n;k++){const x=ax+(bx-ax)*k/n,y=ay+(by-ay)*k/n;if(gaps&&gaps.some(([gx,gy,gr])=>Math.hypot(x-gx,y-gy)<gr))continue;

  return{t,oil,ore,hives,island:{x:IX,y:IY,name:'甲21号目標（島のアビス）',s:'甲'}};
}

    return(f(xi,yi)*(1-u)+f(xi+1,yi)*u)*(1-w)+(f(xi,yi+1)*(1-u)+f(xi+1,yi+1)*u)*w;};

function techState(t){
  if(lvl(t.id)>=(t.max||1))return'done';

  if((t.tier||1)>mapMaxTier())return'maplock';
  if(t.gate){if(!rankOpen(t.cat,t.gate-1)||rankSum(t.cat,t.gate-1)<gateNeed(t.cat,t.gate))return'locked';}
  else if(!rankOpen(t.cat,t.tier||1))return'locked';
  if(t.pre&&!t.pre.every(p=>has(p)))return'locked';
  if(t.preSum&&preSumLv(t)<t.preSum.n)return'locked';
  if(t.excl&&TECH.some(o=>o.excl===t.excl&&o.id!==t.id&&(has(o.id)||S.research.find(r=>r.id===o.id))))return'excluded';

const SPEC_OF_UT={mil:'歩兵',inf:'歩兵',arch:'弓兵',cav:'騎兵',mage:'魔導',drake:'竜騎'};
const DEF_BT=['hq','outpost','fence','gate','swall','wall','brazier','spike','pit','mg','how','cannon','tower'];
const PROD_BT=['miner','quarry','ironmine','farm','fishery','well','ammo','market','tavern','powder','barracks','apart','furnace','lab'];
function specOfTarget(o){if(o.kind==='s')return SPEC_OF_UT[o.ut]||'歩兵';if(DEF_BT.includes(o.type))return '守備';if(PROD_BT.includes(o.type))return '内政';return {train:'歩兵',stable:'騎兵',aerie:'竜騎',magic:'魔導'}[o.type]||'内政';}
const SKILLS={
  '歩兵':[{id:'nagi',name:'薙払',cd:8,desc:'8秒ごと、周り1.6マスの敵をまとめて斬る（部隊の火力×3）'},
          {id:'kobu',name:'鼓舞',cd:16,desc:'16秒ごと、3マス以内の味方部隊の火力+30%（6秒）・体力10%回復'},
          {id:'fukutsu',name:'不屈',cd:18,desc:'18秒ごと、盾を構えて6秒間受ける被害を半分にし、周り3マスの敵を引きつける'}],
  '弓兵':[{id:'yome',name:'夜目',desc:'夜狩りで持ち帰る魔骸 +100%、負傷・戦死の危険が大きく下がる（静かな夜の夜狩りで効く）'},
          {id:'ame',name:'矢雨',cd:10,desc:'10秒ごと、射程内でいちばん敵が密集した所に矢の雨（半径2マスに40）'},
          {id:'taka',name:'鷹目',desc:'射程+3。周り5マスの闇の中の敵も見えて狙える'},
          {id:'sokusha',name:'速射',cd:12,desc:'12秒ごと、4秒間連射が2倍になる'}],
  '騎兵':[{id:'totsu',name:'突撃',cd:12,desc:'12秒ごと、敵へ3マス突進し、通り道の敵に火力×2'},
          {id:'yuugeki',name:'遊撃',desc:'移動の速さ+40%、受ける被害−20%'}],
  '魔導':[{id:'kaen',name:'火球',cd:8,desc:'8秒ごと、敵の群れに火球（半径1.2マスに80）'},
          {id:'rai',name:'雷撃',cd:12,desc:'12秒ごと、射程内の敵5体に連鎖する雷（各60）'},
          {id:'inseki',name:'隕石',cd:25,desc:'25秒ごと、8マス以内の最大の群れに隕石（半径2.5マスに300・2秒スタン）'}],
  '竜騎':[{id:'ibuki',name:'火炎',cd:10,desc:'10秒ごと、周り2.5マスの敵を焼く（60）'},
          {id:'houkou',name:'咆哮',cd:25,desc:'25秒ごと、4マス以内の敵を3秒スタン（動きも攻撃も止まる。ボスには効かない）'}],
  '守備':[{id:'gourei',name:'号令',desc:'配属先の防衛施設の射程+1・連射+25%'},
          {id:'oukyu',name:'修理',cd:20,desc:'20秒ごと、3マス以内の施設・壁を15%修理（戦闘中も）'}],
  '内政':[{id:'shidou',name:'指導',desc:'配属先の生産+50%、2マス以内の同じ種類の施設も+25%'},

};

function skillIcon(id,sz){return `<span style="display:inline-block;vertical-align:-4px;background:#14110c;border:1px solid #5a4a2a;padding:1px;line-height:0">${icSvg('sk_'+id,sz||16)}</span>`;}
function skillLine(c,full){return heroSkills(c).map(k=>`<span title="${k.desc}" style="color:${SPECS[c.spec].color};font-weight:bold">${skillIcon(k.id,full?18:14)} スキル「${k.name}」</span>`+(full?`<div class="muted" style="font-size:10px;margin:2px 0 2px 24px">${k.desc}（威力はLvで上がる）</div>`:'')).join('');}
// 英雄ごとに1つ、得意分野のスキルを持つ（同じ兵科でも人によって違う）
function heroSkills(c){const L=SKILLS[c.spec]||[];if(!L.length)return [];if(!c.skill||!L.find(k=>k.id===c.skill))c.skill=L[Math.floor(Math.random()*L.length)].id;return [L.find(k=>k.id===c.skill)];}
// 配属先 o の英雄が、適任でスキル id を覚えているか
function heroSk(o,id){const c=cmdOf(o);if(!c||match(c,o)<1)return false;return heroSkills(c).some(k=>k.id===id);}
function posOfObj(o){if(o.kind==='s'){if(o.gar){const t=S.blds.find(b=>b.id===o.gar);if(t)return [(t.x+.5)*T,(t.y+.5)*T];}return [o.x,o.y];}return [(o.x+.5)*T,(o.y+.5)*T];}
function enemiesIn(x,y,r,ground){const o=[];for(const e of S.enemies){if(e.hp<=0)continue;if(ground&&E[e.type].fly)continue;if(Math.hypot(e.x-x,e.y-y)<=r)o.push(e);}return o;}
function densest(x,y,r,rad){let best=null,bn=0;const cs=enemiesIn(x,y,r).filter(seenE);for(const e of cs){let n=0;for(const o of cs)if(Math.hypot(o.x-e.x,o.y-e.y)<rad)n++;if(n>bn){bn=n;best=e;}}return best;}
function floatTxt(x,y,txt,col,ic){(S.ftx=S.ftx||[]).push({x,y,txt,col,ic,t:0});}
function skillTick(dt){
  S.eyes=[];
  for(const q of S.squads){if(q.buffT>0)q.buffT-=dt;if(q.invT>0)q.invT-=dt;if(q.shieldT>0)q.shieldT-=dt;if(q.rapidT>0)q.rapidT-=dt;}
  for(const e of S.enemies)if(e.tauntT>0)e.tauntT-=dt;
  for(const b of S.blds){if(b.boostT>0)b.boostT-=dt;}
  for(const f of (S.ftx||[]))f.t+=dt;if(S.ftx)S.ftx=S.ftx.filter(f=>f.t<1.4);
  for(const c of S.cmds){if(!c.alive||!c.assign)continue;const o=findObj(c.assign);if(!o||match(c,o)<1)continue;
    const [x,y]=posOfObj(o);const pm=1+0.1*(c.lv-1);const col=SPECS[c.spec].color;c.cdk=c.cdk||{};
    for(const k of heroSkills(c)){
      if(k.id==='taka'){S.eyes.push([x,y,5*T]);continue;}
      if(!k.cd)continue;
      c.cdk[k.id]=(c.cdk[k.id]||0)-dt;if(c.cdk[k.id]>0)continue;
      let used=false;
      const sd=o.kind==='s'?unitDmg(o):40;
      if(k.id==='fukutsu'&&o.kind==='s'){const es=enemiesIn(x,y,3*T,true);if(es.length){o.shieldT=6;for(const e of es){e.taunt=o;e.tauntT=6;}S.fx.push({x,y,r:3*T,t:0,dur:0.6,c:'#8ac0ff'});used=true;}}
      else if(k.id==='sokusha'&&o.kind==='s'){if(enemiesIn(x,y,(unitRange(o)+1)*T).some(seenE)){o.rapidT=4;used=true;}}
      else if(k.id==='nagi'){const es=enemiesIn(x,y,1.6*T,true);if(es.length){for(const e of es)hitEnemy(e,sd*3*pm,o);S.fx.push({x,y,r:1.6*T,t:0,dur:0.35,c:'#ffffff'});used=true;}}
      else if(k.id==='kobu'||k.id==='hata'){if(S.enemies.length){const R=(k.id==='kobu'?3:4)*T;for(const q of S.squads)if(Math.hypot(q.x-x,q.y-y)<=R){q.buffT=6;if(k.id==='kobu')q.hp=Math.min(q.maxhp,q.hp+q.maxhp*0.1);}S.fx.push({x,y,r:R,t:0,dur:0.6,c:col});used=true;}}
      else if(k.id==='ame'){const rg=(o.kind==='s'?unitRange(o):6)+2;const tg=densest(x,y,rg*T,2*T);if(tg){for(const e of enemiesIn(tg.x,tg.y,2*T))hitEnemy(e,40*pm,o);for(let i=0;i<10;i++){const a=Math.random()*7,d=Math.random()*2*T;S.shots.push({x,y,tx:tg.x+Math.cos(a)*d,ty:tg.y+Math.sin(a)*d,t:0,dur:0.35,arrow:true});}used=true;}}
      else if(k.id==='sogeki'){const rg=(o.kind==='s'?unitRange(o):6)*1.5*T;let tg=null;for(const e of enemiesIn(x,y,rg))if(seenE(e)&&(!tg||e.hp>tg.hp))tg=e;if(tg){hitEnemy(tg,300*pm,o,true);S.shots.push({x,y,tx:tg.x,ty:tg.y,t:0,dur:0.25,arrow:true,big:true});S.fx.push({x:tg.x,y:tg.y,r:10,t:0,dur:0.3,c:'#ffffff'});used=true;}}
      else if(k.id==='totsu'&&o.kind==='s'){let tg=null,bd=5*T;for(const e of enemiesIn(x,y,5*T,true))if(seenE(e)){const d=Math.hypot(e.x-x,e.y-y);if(d<bd){bd=d;tg=e;}}
        if(tg){const a=Math.atan2(tg.y-y,tg.x-x),L=Math.min(3*T,bd+T*0.5);let ex=x,ey=y;for(let st=0;st<12;st++){const nx=x+Math.cos(a)*L*(st+1)/12,ny=y+Math.sin(a)*L*(st+1)/12;if(allyBlockAt(Math.floor(nx/T),Math.floor(ny/T)))break;ex=nx;ey=ny;}
          for(const e of S.enemies)if(e.hp>0&&!E[e.type].fly&&segDist(e.x,e.y,x,y,ex,ey)<0.8*T)hitEnemy(e,sd*2*pm,o);o.x=ex;o.y=ey;S.shots.push({x,y,tx:ex,ty:ey,t:0,dur:0.25,c:col,w:3});used=true;}}
      else if(k.id==='kaen'){const tg=densest(x,y,((o.kind==='s'?unitRange(o):5)+1)*T,1.2*T);if(tg){for(const e of enemiesIn(tg.x,tg.y,1.2*T))hitEnemy(e,80*pm,o);S.fx.push({x:tg.x,y:tg.y,r:1.2*T,t:0,dur:0.4,c:'#ff8a3a'});S.shots.push({x,y,tx:tg.x,ty:tg.y,t:0,dur:0.2,c:'#ffb04a',w:3});used=true;}}
      else if(k.id==='rai'){const rg=((o.kind==='s'?unitRange(o):5)+1)*T;let cur=[x,y];const hit=new Set();for(let i=0;i<5;i++){let tg=null,bd=i?3*T:rg;for(const e of S.enemies){if(e.hp<=0||hit.has(e)||!seenE(e))continue;const d=Math.hypot(e.x-cur[0],e.y-cur[1]);if(d<bd){bd=d;tg=e;}}if(!tg)break;hit.add(tg);hitEnemy(tg,60*pm,o);S.shots.push({x:cur[0],y:cur[1],tx:tg.x,ty:tg.y,t:0,dur:0.25,c:'#c8e8ff',w:2});cur=[tg.x,tg.y];}used=hit.size>0;}
      else if(k.id==='inseki'){const tg=densest(x,y,8*T,2.5*T);if(tg){for(const e of enemiesIn(tg.x,tg.y,2.5*T)){hitEnemy(e,300*pm,o,true);if(!E[e.type].boss)e.stun=Math.max(e.stun||0,2);}S.fx.push({x:tg.x,y:tg.y,r:2.5*T,t:0,dur:0.7,c:'#ff6a3a'});se('boom');used=true;}}
      else if(k.id==='ibuki'){const es=enemiesIn(x,y,2.5*T);if(es.length){for(const e of es)hitEnemy(e,60*pm,o);S.fx.push({x,y,r:2.5*T,t:0,dur:0.45,c:'#ff7a2a'});used=true;}}
      else if(k.id==='kouka'){let tg=null;for(const e of enemiesIn(x,y,6*T))if(seenE(e)&&(!tg||e.hp>tg.hp))tg=e;if(tg){hitEnemy(tg,250*pm,o,true);if(!E[tg.type].boss)tg.stun=2;S.fx.push({x:tg.x,y:tg.y,r:T,t:0,dur:0.4,c:'#ff5a3a'});used=true;}}
      else if(k.id==='houkou'){const es=enemiesIn(x,y,4*T);if(es.length){for(const e of es)if(!E[e.type].boss)e.stun=Math.max(e.stun||0,3);S.fx.push({x,y,r:4*T,t:0,dur:0.7,c:'#ffd04a'});used=true;}}
      else if(k.id==='issei'){if(enemiesIn(x,y,10*T).length){for(const b of S.blds)if(gunOf(b)&&Math.hypot((b.x+.5)*T-x,(b.y+.5)*T-y)<=4*T){b.cd=0;b.boostT=3;}S.fx.push({x,y,r:4*T,t:0,dur:0.5,c:col});used=true;}}
      else if(k.id==='oukyu'){let n=0;for(const b of S.blds){if(b.hp>=b.maxhp||Math.hypot((b.x+.5)*T-x,(b.y+.5)*T-y)>3*T)continue;b.hp=Math.min(b.maxhp,b.hp+b.maxhp*0.15);n++;}if(n){S.fx.push({x,y,r:3*T,t:0,dur:0.5,c:'#9fe08a'});used=true;}}
      if(used){c.cdk[k.id]=k.cd*(has('amulet')?0.7:1);floatTxt(x,y-14,k.name+'！',col,'sk_'+k.id);}
    }
  }
}

function cmdOf(o){return o.cmd?S.cmds.find(c=>c.id===o.cmd&&c.alive):null;}
function assign(c,target){
  if(c.assign){const o=findObj(c.assign);if(o)o.cmd=null;}
  if(target){
    const prev=cmdOf(target);if(prev)prev.assign=null;
    target.cmd=c.id;c.assign=target.id;
    log(`${cmdName(c)}、${objName(target)}に着任${match(c,target)===1?'（適任）':''}`);
  }else c.assign=null;
}
function findObj(id){return S.blds.find(b=>b.id===id)||S.squads.find(s=>s.id===id);}
function matUp(b){const m=(b.mat||0)+1;if(!MAT_HP[b.type]||m>bestMat())return;const c=MAT_COST[b.type][m];if(!canAfford(c)||S.waveActive){se('error');return;}for(const k in c)S[k]-=c[k];b.mat=m;const n=hpOf(b.type,b.lv,m);b.hp+=n-b.maxhp;b.maxhp=n;se('upgrade');log(`${MAT_NAME[b.type][m]}に造り替えた`,'good');renderInfo(true);}
function objName(o){return o.kind==='s'?unitLabel(o):B[o.type].name+(o.lv>1?' Lv'+o.lv:'');}
function killCmd(o,cause){
  const c=cmdOf(o);if(!c)return;
  if(c.trait==='強運'&&Math.random()<0.3){
    c.assign=null;o.cmd=null;
    log(`${cmdName(c)}、${objName(o)}の損失から奇跡的に生還（負傷）`,'warn');return;
  }
  c.alive=false;c.assign=null;c.diedWave=S.wave;c.cause=cause;
  S.cmds=S.cmds.filter(x=>x!==c);S.fallen.push(c);
  se('kia');log(`【戦死】${cmdName(c)}（${c.spec}・Lv${c.lv}）— ${cause}`,'kia');
  if(S.selCmd===c.id)S.selCmd=null;
}
function bonus(o){
  const c=cmdOf(o);const r={dmg:1,rate:1,prod:1,hp:1,red:0,regen:0};
  if(o.kind!=='s'&&PROD_BT.includes(o.type))r.prod*=prodNeighborMul(o);
  if(!c)return r;const m=match(c,o);
  r.dmg=1+c.atk*0.05*m; r.rate=1+c.tec*0.02*m; r.prod=1+c.tec*0.04*m;
  r.hp=1+c.def*0.05*m; r.red=Math.min(0.5,c.def*0.02*m); r.regen=c.def*0.8*m;
  if(c.trait==='冷静沈着')r.red=Math.min(0.6,r.red+0.1);
  if(c.trait==='猪突猛進'){r.dmg*=1.15;r.red-=0.1;}
  if(c.trait==='技術畑')r.prod*=1.15;
  if(m===1){const ks=heroSkills(c).map(k=>k.id);if(ks.includes('gourei'))r.rate*=1.25;if(ks.includes('shidou'))r.prod*=1.5;if(ks.includes('kenyaku'))r.prod*=1.15;}
  return r;
}
function prodNeighborMul(b){for(const o of S.blds){if(o===b||o.type!==b.type||Math.abs(o.x-b.x)>2||Math.abs(o.y-b.y)>2)continue;if(heroSk(o,'shidou'))return 1.25;}return 1;}
function hireCost(c){return {gold:60+(c.lv-1)*80+(c.trait?20:0)};}
function genCands(){
  S.cands=[];
  for(let i=0;i<3;i++){
    let lv=1;const r=Math.random();const w=S.wave;
    if(r<0.15+w*0.04)lv=2;if(r<0.04+w*0.02)lv=3;if(w>=6&&r<0.03)lv=4;
    S.cands.push(makeCmd(null,lv));
  }
}
function hire(id){
  const c=S.cands.find(x=>x.id===id);if(!c)return;const cost=hireCost(c);
  if(!canAfford(cost,3)||S.cmds.length>=maxCmd())return;
  for(const k in cost)S[k]-=cost[k];S.pop-=3;
  S.cands=S.cands.filter(x=>x!==c);S.cmds.push(c);se('hire');
  log(`${cmdName(c)}（${c.spec}）着任`,'good');
}

// ===== ログ =====
// 画面の上に流れる大きめの通知
// 資源の増減をアイコン付きで（例：{gold:200,steel:150}）
function resTxt(o,big){return Object.entries(o).filter(([k,v])=>v).map(([k,v])=>`<span style="display:inline-flex;align-items:center;gap:2px;margin-right:8px;white-space:nowrap">${ic(k,big?18:14)}<b>${v>0?'+':''}${Math.round(v)}</b></span>`).join('');}
// 消費の記録：夜の襲撃中に、どこで何をどれだけ使ったか
function useRes(src,k,v,b){S[k]-=v;if(!S.waveActive||!(v>0))return;const L=S.wled||(S.wled={});const o=L[src]||(L[src]={});o[k]=(o[k]||0)+v;if(b){const u=b.wuse||(b.wuse={});u[k]=(u[k]||0)+v;}}
function supCosts(sp){return sp.costs||{[sp.key]:sp.per};}
function supAvail(sp){let m=1e9;const c=supCosts(sp);for(const k in c)m=Math.min(m,(S[k]||0)/c[k]);return m;}
function supPay(sp,n,src){const c=supCosts(sp);for(const k in c)useRes(src,k,n*c[k]);}
function wledHTML(){const L=S.wled||{};const rows=Object.entries(L).map(([src,o])=>[src,o,Object.values(o).reduce((a,v)=>a+v,0)]).sort((a,b)=>b[2]-a[2]);if(!rows.length)return '';
  const tot={};for(const [,o] of rows)for(const k in o)tot[k]=(tot[k]||0)+o[k];
  return `<div style="margin-top:8px"><b>消費</b> <span style="margin-left:6px">${resTxt(Object.fromEntries(Object.entries(tot).map(([k,v])=>[k,-v])))}</span></div><div style="font-size:11.5px;margin-top:2px">`+rows.map(([src,o])=>`<div class="row" style="padding:1px 0"><span class="muted">${src}</span><span>${resTxt(Object.fromEntries(Object.entries(o).map(([k,v])=>[k,-v])))}</span></div>`).join('')+`</div>`;}
function toast(msg,kind,ms){const box=document.getElementById('toasts');if(!box)return;const cv=document.getElementById('cv').getBoundingClientRect();box.style.left=(cv.left+cv.width/2)+'px';box.style.top=(cv.top+14)+'px';
  const d=document.createElement('div');const col={warn:'#f2b33d',bad:'#ff5a4e',good:'#7ad06a',wave:'#ff5a4e'}[kind]||'#e8e0c8';
  d.style.cssText=`background:rgba(14,12,10,.92);border:1px solid ${col};color:${col};padding:${kind==='wave'?'10px 22px':'6px 14px'};font-weight:bold;font-size:${kind==='wave'?(isNarrow()?'16px':'20px'):'13px'};white-space:${kind==='wave'?'nowrap':'normal'};max-width:calc(100vw - 24px);box-shadow:0 2px 12px #000a;transition:opacity .5s;letter-spacing:${kind==='wave'?'2px':'0'}`;
  if(/<svg|<b>|<span/.test(msg))d.innerHTML=msg;else d.textContent=msg;box.appendChild(d);while(box.children.length>4)box.firstChild.remove();setTimeout(()=>{d.style.opacity='0';setTimeout(()=>d.remove(),600);},ms||3500);}
function log(msg,cls){
  const el=document.getElementById('log');const d=document.createElement('div');
  d.textContent=`[T${S?S.turn:1}${S&&S.waveActive?'・交戦':''}] ${msg}`;if(cls)d.className=cls;
  el.prepend(d);while(el.children.length>80)el.lastChild.remove();
  if(S&&S.rep)S.rep.push({msg,cls});
}

// ===== 襲撃の生成 =====
const TACTICS={
  swarm:'ゴブリンの群れが散発的に押し寄せる。足の速いゴブリンライダーが先に来る',
  mixed:'ゴブリンライダーの突撃のあと、トロールを先頭にゴブリン・オーガの本隊。空からハーピー',
  vanguard:'ゴブリンライダー → トロールが壁を壊し、ゴブリン・オーガがなだれ込む。後方からシャーマンが防衛施設を狙撃',
  combined:'複数のアビスから同時に襲撃。ゴブリンライダー → 本隊とシャーマン → 空からドラゴン → 攻城兵器シーカー',

function genWave(n){

function nearestSea(x,y,r){let best=null,bd=1e9;for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=COLS||ny>=ROWS||S.ter[ny][nx]!==6)continue;const d=dx*dx+dy*dy;if(d<bd){bd=d;best=[nx,ny];}}return best;}

function allyBlockAt(x,y){if(x<0||y<0||x>=COLS||y>=ROWS)return true;if(isBlock(S.ter[y][x]))return true;const b=S.grid[y][x];return !!(b&&b.type!=='gate'&&(WALL_TYPES.includes(b.type)||B[b.type].towerWall));}
const AF={};
function allyFlow(tx,ty){const k=tx+','+ty,now=performance.now();const c=AF[k];if(c&&now-c.t<700)return c.f;
  const f=new Uint16Array(COLS*ROWS).fill(65535);const q=new Int32Array(COLS*ROWS);let h=0,t=0;f[ty*COLS+tx]=0;q[t++]=ty*COLS+tx;

// 行き先に通じていないとき：自分から歩いて行ける範囲で、行き先にいちばん近いマス（壁の手前など）
function nearReach(cx,cy,gx,gy){const seen=new Set([cy*COLS+cx]);const q=[[cx,cy]];let best=[cx,cy],bd=Math.hypot(cx-gx,cy-gy);

// 自分と敵の間に壁があれば、こちら側の壁ぎわのマスの中心を返す
function wallFront(s,e){const n=Math.ceil(Math.hypot(e.x-s.x,e.y-s.y)/(T*0.3));let prev=null;

function stepTo(s,x,y,dt,firing){
  if(MT(s).naval)return stepSea(s,x,y,dt,firing);
  const dx=x-s.x,dy=y-s.y,dd=Math.hypot(dx,dy);if(dd<=3)return true;

  const fuelOk=S.fuel>0;if(fuelOk)S.fuel=Math.max(0,S.fuel-(s.ut==='tank'?0.2:s.ut==='air'?0.5:0.15)*dt);
  const t=MT(s);let sp=(heroSk(s,'yuugeki')?1.4:1)*(s.ut==='cav'&&has('charge')?1.2:1)*(s.kind==='s'?eqP(s,'spd'):1)*t.spd*(s.ut==='mech'&&has('jump')?1.4:1)*(firing?0.5:1)*(fuelOk?1:0.4)*dt;

function stepSea(s,x,y,dt,firing){

// 部隊の行動：迎撃=待機地点の周囲6マスの敵を自動で迎え撃つ／固守=その場から動かない／帰還=兵舎で修理

  const L=lvl('scout');const total=w.q.length;

  if(L===0)r.total='約'+Math.max(10,Math.round(total*w.noise0/10)*10);

  else r.total=String(total);
  if(L>=1){r.types=[...new Set(w.q.map(e=>e.type))];}
  if(L>=2){r.cnt={};for(const e of w.q)r.cnt[e.type]=(r.cnt[e.type]||0)+1;}
  if(L>=3){r.tactic=TACTICS[w.tactic];r.perSide=w.perSide;r.sideComp=w.sideComp;}

}

const MILL=["....oooo....","...owwwWo...","..owwwwwWo..","..oRRRRRRo..",".oRRRRRRRRo.","...osssSo...","...osssSo...","...osdsSo...","...ossdSo...","..ossssSSo..","..ossddsSo..","..ossddsSo..","..oooooooo..",".xxxxxxxxxx."];

const CL_CACHE={};
function clusterSpots(type,minN,per){
  const farms=S.blds.filter(b=>b.type===type&&!(b.bt>0&&!b.upg));
  const sig=farms.map(b=>b.id).join(',');const cc=CL_CACHE[type];if(cc&&cc.sig===sig)return cc.list;

  for(const f of farms){if(seen.has(f.id))continue;const grp=[];const q=[f];seen.add(f.id);
    while(q.length){const c=q.pop();grp.push(c);for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const n=at.get((c.x+dx)+','+(c.y+dy));if(n&&!seen.has(n.id)){seen.add(n.id);q.push(n);}}}
    if(grp.length<minN)continue;
    const cx=grp.reduce((a,b)=>a+b.x,0)/grp.length,cy=grp.reduce((a,b)=>a+b.y,0)/grp.length;
    const n=1+Math.floor((grp.length-minN)/per);const picks=[grp.slice().sort((a,b)=>Math.hypot(a.x-cx,a.y-cy)-Math.hypot(b.x-cx,b.y-cy))[0]];
    while(picks.length<n){let best=null,bd=-1;for(const g of grp){const d=Math.min(...picks.map(p=>Math.hypot(p.x-g.x,p.y-g.y)));if(d>bd){bd=d;best=g;}}if(!best||bd<2)break;picks.push(best);}

}

    if(d.fly){ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(e.x+4,e.y+sz*0.45,sz*0.35,sz*0.12,0,0,7);ctx.fill();}
    if(e.buff){ctx.strokeStyle='rgba(255,200,60,.7)';ctx.beginPath();ctx.ellipse(e.x,e.y+sz*0.4,sz*0.45,sz*0.16,0,0,7);ctx.stroke();}
    ctx.save();ctx.imageSmoothingEnabled=false;ctx.translate(e.x,e.y+bob);if((e.face||1)<0)ctx.scale(-1,1);ctx.drawImage(im,-sz/2,-sz/2,sz,sz);ctx.restore();
    if(ratio<0.999&&e.type!=='swarm'&&e.type!=='king'){const w=Math.max(10,sz*0.7);ctx.fillStyle='rgba(30,0,0,.8)';ctx.fillRect(e.x-w/2,e.y-sz/2-3+bob,w,2);ctx.fillStyle=ratio>0.5?'#e0c040':'#e04030';ctx.fillRect(e.x-w/2,e.y-sz/2-3+bob,w*ratio,2);}
    return;}}
  if(e.type==='heavy'){ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(e.x+3,e.y+5,r*1.5,r*0.8,0,0,7);ctx.fill();for(let i=-1;i<=1;i++){ctx.fillStyle='#8ac060';ctx.beginPath();ctx.arc(e.x+i*r*0.5,e.y-r*0.7,2.6,0,7);ctx.fill();}}
  if(e.buff){ctx.strokeStyle='rgba(255,200,60,.6)';ctx.beginPath();ctx.arc(e.x,e.y,r+3,0,7);ctx.stroke();}
  if(d.fly){const f=Math.sin(nowS()*14+e.x)*0.5+0.5;ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(e.x+6,e.y+10,r,r*0.4,0,0,7);ctx.fill();
    ctx.fillStyle=d.color;ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.x-r*1.8,e.y-r*(0.3+f));ctx.lineTo(e.x-r*0.6,e.y+r*0.3);ctx.closePath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.x+r*1.8,e.y-r*(0.3+f));ctx.lineTo(e.x+r*0.6,e.y+r*0.3);ctx.closePath();ctx.fill();}
  ctx.save();
  if(e.type==='charger'&&e.target){/* 進行方向に向ける */}
  enemyPath(e,d);
  ctx.fillStyle='rgba(60,20,20,.85)';ctx.fill();
  ctx.clip();
  ctx.fillStyle=d.color;ctx.fillRect(e.x-r*1.2,e.y+r*1.1-r*2.2*ratio,r*2.4,r*2.2*ratio);
  ctx.restore();
  if(e.type!=='swarm'){enemyPath(e,d);ctx.strokeStyle=d.color;ctx.lineWidth=1;ctx.stroke();}
}

const mouse={x:0,y:0,in:false};
function toScreen(ev){const r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left)*VW/r.width,y:(ev.clientY-r.top)*VH/r.height};}
function toCanvas(ev){const p=toScreen(ev);return{x:cam.x+p.x/cam.z,y:cam.y+p.y/cam.z,sx:p.x,sy:p.y};}
function mmPos(){const off=document.body.classList.contains('fullmap')&&!isNarrow()&&document.getElementById('right').classList.contains('open')?350:0;return[VW-MM.w-8-off,VH-MM.h-8-(document.body.classList.contains('fullmap')&&!isNarrow()?46:0)];}
function inMini(p){const [mx,my]=mmPos();return p.sx>=mx&&p.sy>=my&&p.sx<mx+MM.w&&p.sy<my+MM.h?{x:(p.sx-mx)/MM.w*W,y:(p.sy-my)/MM.h*H}:null;}
const drag={mini:false};
cv.addEventListener('mousemove',ev=>{const p=toCanvas(ev);mouse.x=p.x;mouse.y=p.y;mouse.in=true;});
// ポインタ操作：タップ＝選択／ドラッグ＝地図移動／2本指＝ピンチで拡大縮小（マウス・タッチ共通）
const ptrs=new Map();let gest=null;
const pxScale=()=>VW/cv.getBoundingClientRect().width;
function minZoom(){return Math.min(0.4,VW/W*0.98);}
function zoomAt(z,sx,sy){const wx=cam.x+sx/cam.z,wy=cam.y+sy/cam.z;z=Math.max(minZoom(),Math.min(1.8,z));cam.z=z;cam.x=wx-sx/z;cam.y=wy-sy/z;clampCam();}
cv.addEventListener('pointerdown',ev=>{
  if(ev.pointerType==='mouse'&&ev.button===2)return;
  try{cv.setPointerCapture(ev.pointerId);}catch(e){}
  ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  const p=toCanvas(ev);
  if(ptrs.size===1){
    if(inMini(p)){gest={mode:'mini'};const m=inMini(p);cam.x=m.x-VW/cam.z/2;cam.y=m.y-VH/cam.z/2;clampCam();return;}
    gest={mode:ev.button===1?'pan':'tap',sx:ev.clientX,sy:ev.clientY,cx:cam.x,cy:cam.y,shift:ev.shiftKey};
    if(ev.button===1)ev.preventDefault();
  }else if(ptrs.size===2){
    const [a,b]=[...ptrs.values()];const r=cv.getBoundingClientRect();
    gest={mode:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y),z0:cam.z,
      wx:cam.x+((a.x+b.x)/2-r.left)*pxScale()/cam.z,wy:cam.y+((a.y+b.y)/2-r.top)*pxScale()/cam.z};
  }
});
cv.addEventListener('pointermove',ev=>{
  if(!ptrs.has(ev.pointerId))return;ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(!gest)return;
  if(gest.mode==='mini'){const m=inMini(toCanvas(ev));if(m){cam.x=m.x-VW/cam.z/2;cam.y=m.y-VH/cam.z/2;clampCam();}return;}
  if(gest.mode==='tap'&&Math.hypot(ev.clientX-gest.sx,ev.clientY-gest.sy)>8)gest.mode='pan';
  if(gest.mode==='pan'){const k=pxScale()/cam.z;cam.x=gest.cx-(ev.clientX-gest.sx)*k;cam.y=gest.cy-(ev.clientY-gest.sy)*k;clampCam();}
  if(gest.mode==='pinch'&&ptrs.size>=2){
    const [a,b]=[...ptrs.values()];const r=cv.getBoundingClientRect();
    const z=Math.max(minZoom(),Math.min(1.8,gest.z0*Math.hypot(a.x-b.x,a.y-b.y)/Math.max(1,gest.d0)));
    const sx=((a.x+b.x)/2-r.left)*pxScale(),sy=((a.y+b.y)/2-r.top)*pxScale();
    cam.z=z;cam.x=gest.wx-sx/z;cam.y=gest.wy-sy/z;clampCam();
  }
});
function ptrEnd(ev){
  if(!ptrs.has(ev.pointerId))return;ptrs.delete(ev.pointerId);
  if(gest&&gest.mode==='tap'&&ev.type==='pointerup'&&ptrs.size===0)handleTap(ev,gest.shift);
  if(ptrs.size===0||(gest&&gest.mode==='pinch'))gest=null;
}
cv.addEventListener('pointerup',ptrEnd);cv.addEventListener('pointercancel',ptrEnd);
cv.addEventListener('wheel',ev=>{ev.preventDefault();const p=toCanvas(ev);zoomAt(cam.z*(ev.deltaY<0?1.12:1/1.12),p.sx,p.sy);},{passive:false});
const keysDown=new Set();
document.addEventListener('keyup',ev=>keysDown.delete(ev.key.toLowerCase()));
window.addEventListener('blur',()=>keysDown.clear());
function panCam(dt){
  if(S.overlay)return;let vx=0,vy=0;
  if(keysDown.has('a')||keysDown.has('arrowleft'))vx--;if(keysDown.has('d')||keysDown.has('arrowright'))vx++;
  if(keysDown.has('w')||keysDown.has('arrowup'))vy--;if(keysDown.has('s')||keysDown.has('arrowdown'))vy++;
  if(vx||vy){cam.x+=vx*700*dt/cam.z;cam.y+=vy*700*dt/cam.z;clampCam();}
}
cv.addEventListener('mouseleave',()=>mouse.in=false);
cv.addEventListener('contextmenu',ev=>{ev.preventDefault();
  const p=toCanvas(ev);if(inMini(p))return;
  if(S.aimNaval){S.aimNaval=false;return;}
  if(S.buildMode||S.buildPick){exitBuild();return;}
  if(S.sel&&S.sel.kind==='s'){orderMove(S.sel,p.x,p.y);S.fx.push({x:p.x,y:p.y,r:10,t:0,dur:0.4,c:'#62c6d9'});se('click');renderInfo(true);}
});
// 住居：城館に30名、兵舎1棟に12名（Lv2:20名・Lv3:30名）、研究「居住区拡張」で兵舎1棟 +4名/Lv
const HOUSE=[12,20,30];
function houseOf(b){return b.type==='hq'?30+10*((S.baseLv||1)-1):b.type==='barracks'&&ready(b)?HOUSE[b.lv-1]+3*lvl('housing'):b.type==='apart'&&ready(b)?[36,54,72][b.lv-1]:0;}
function popCapOf(){let c=0;for(const b of S.blds)c+=houseOf(b);return c;}
function popTotal(){let t=S.pop;for(const b of S.blds){t+=b.crew||0;if(b.qm)for(const m of b.qm){const u=MTC[m];t+=u.popEach*u.members;}}
  for(const s of S.squads)t+=s.members*MT(s).popEach;for(const r of S.research)t+=(r.paid&&r.paid.pop)||0;return t;}
function deselect(){S.multi=[];S.sel=null;S.selTile=null;renderInfo(true);renderMode();}
function handleTap(ev,shift){
  const prevSel=S.sel,prevTile=S.selTile&&(S.selTile.x+','+S.selTile.y);
  setTimeout(()=>{const nowTile=S.selTile&&(S.selTile.x+','+S.selTile.y);if((S.sel&&S.sel!==prevSel)||(!S.sel&&S.selTile&&nowTile!==prevTile&&!(prevSel&&prevSel.kind==='s'))){openSheet();const i=document.getElementById('info');if(i)i.scrollIntoView({block:'nearest',behavior:'smooth'});}},0);
  if(S.over||S.overlay)return;
  const p=toCanvas(ev);if(inMini(p))return;const gx=Math.floor(p.x/T),gy=Math.floor(p.y/T);
  ev={shiftKey:shift};
  if(S.aimNaval){fireNaval(p.x,p.y);return;}
  if(S.buildMode){
    if(!canPlace(S.buildMode,gx,gy))se('error');
    if(canPlace(S.buildMode,gx,gy)){placeB(S.buildMode,gx,gy);S.fx.push({x:(gx+.5)*T,y:(gy+.5)*T,r:T*0.8,t:0,dur:0.35,c:'#6fe08a'});renderBuild();renderInfo(true);renderMode();}
    return;
  }
  const hitR=Math.max(20,(IS_TOUCH?34:24)/cam.z);
  if(S.sel&&S.sel.kind==='s'&&Math.hypot(S.sel.x-p.x,S.sel.y-p.y)<hitR*1.3){deselect();return;}
  {let best=null,bd=hitR;for(const s of S.squads){if(s.gar)continue;const d=Math.hypot(s.x-p.x,s.y-p.y);if(d<bd){bd=d;best=s;}}
   if(best&&(shift||S.multi.length)){const i=S.multi.indexOf(best.id);if(i>=0)S.multi.splice(i,1);else S.multi.push(best.id);if(S.sel&&S.sel.kind==='s'&&!S.multi.includes(S.sel.id)&&S.sel!==best)S.multi.push(S.sel.id);S.sel=null;renderInfo(true);renderMode();return;}
   if(best){const s=best;if(S.sel===s){deselect();return;}S.sel=s;S.selTile=null;renderInfo(true);renderMode();return;}}
  if(S.multi.length&&!(S.grid[gy]&&S.grid[gy][gx])){const us=S.squads.filter(x=>S.multi.includes(x.id)&&!x.gar);us.forEach((u,i)=>{const a=i*2.4,r=i?T*(0.8+0.25*i):0;orderMove(u,p.x+Math.cos(a)*r,p.y+Math.sin(a)*r,true);});S.fx.push({x:p.x,y:p.y,r:14,t:0,dur:0.4,c:'#62c6d9'});se('click');return;}
  // 部隊を選択中なら、空き地のクリックで移動命令
  if(S.sel&&S.sel.kind==='s'&&!(S.grid[gy]&&S.grid[gy][gx])){orderMove(S.sel,p.x,p.y);S.fx.push({x:p.x,y:p.y,r:10,t:0,dur:0.4,c:'#62c6d9'});se('click');renderInfo(true);return;}
  if(gx>=0&&gx<COLS&&gy>=0&&gy<ROWS&&S.grid[gy][gx]){if(S.sel===S.grid[gy][gx]){deselect();return;}S.sel=S.grid[gy][gx];S.selTile=null;renderInfo(true);return;}
  if(S.selTile&&S.selTile.x===gx&&S.selTile.y===gy&&!S.sel){deselect();return;}
  S.sel=null;S.selTile=(gx>=0&&gy>=0&&gx<COLS&&gy<ROWS)?{x:gx,y:gy}:null;renderInfo(true);
}
// 地形ごとの採集：その土地に合った施設だけが建ち、地形のレベルで産出が変わる
const YIELD={miner:'steel',quarry:'stone',ironmine:'iron',farm:'fuel',fishery:'fuel',well:'elec'};
const YMUL=[0,1,1.4,1.8];
function yieldAt(type,x,y){
  if(x<0||y<0||x>=COLS||y>=ROWS)return 0;const t=S.ter[y][x];
  const near=(f,r)=>{let n=0;for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const nx=x+dx,ny=y+dy;if((dx||dy)&&nx>=0&&ny>=0&&nx<COLS&&ny<ROWS&&f(S.ter[ny][nx]))n++;}return n;};
  if(type==='miner')return t===2?YMUL[forestAt(x,y)]:0;                       // 森の上：森が深いほど多い
  if(type==='quarry'){if(t===1)return YMUL[elevAt(x,y)];if((t===0||t===8)&&near(v=>v===3,1))return 1;return 0;}   // 丘の上（高いほど多い）か岩場のそば
  if(type==='ironmine')return S.ore[y][x]?RICH[richAt(x,y)]:0;               // 鉄鉱脈の上
  if(type==='farm')return (t===0&&!S.ore[y][x]&&!S.oil[y][x])?1:0;           // 平地
  if(type==='fishery')return (t===0||t===8||t===2||t===1)&&!S.ore[y][x]&&!S.oil[y][x]&&near(v=>v===6||v===9||v===10||v===12,2)?1:0;  // 川・湖・海から2マス以内
  if(type==='well')return S.oil[y][x]?RICH[richAt(x,y)]:0;                   // 龍脈の泉
  return 0;
}
// 採集する資源には埋蔵量があり、掘り尽くすと止まる（遠くの資源へ広げる理由）
function reserveOf(type,x,y){const v=yieldAt(type,x,y);return type==='miner'?Math.round(700*v):type==='quarry'?Math.round(900*v):type==='ironmine'?Math.round(600*v):type==='well'?Math.round(320*v):Infinity;}
function prodOf(b){const k=TURN_SEC,bn=bonus(b),um=UP.prod[b.lv-1]*eff(b)*happyMul();if(b.bt>0||b.dep||b.off)return null;
  switch(b.type){case 'miner':return {steel:1.0*um*(b.ym||1)*techMul('miner')*bn.prod*k};case 'quarry':return {stone:0.6*um*(b.ym||1)*techMul('quarry')*bn.prod*k};
  case 'ironmine':return {iron:0.6*um*RICH[richAt(b.x,b.y)]*techMul('ironmine')*bn.prod*k};case 'farm':return {fuel:0.8*um*techMul('farm')*bn.prod*k};
  case 'fishery':return {fuel:1.0*um*techMul('fishery')*bn.prod*k};case 'well':return {elec:0.3*um*RICH[richAt(b.x,b.y)]*bn.prod*k};case 'market':return {gold:0.6*um*bn.prod*k};
  case 'ammo':{const m=um*techMul('ammo')*bn.prod*k;const kf=heroSk(b,'kenyaku')?0.6:1;return b.mode==='sword'?{sword:0.5*m,steel:-0.2*m*kf,iron:-0.4*m*kf}:{ammo:3.0*m,steel:-0.4*m*kf,iron:-0.2*m*kf};}
  case 'barracks':return {pop:S.happy>=35?bn.prod*3:0};case 'apart':return {pop:S.happy>=35?bn.prod*5:0};case 'tavern':return {fuel:-0.2*k};
  case 'furnace':{const m=0.2*um*bn.prod*k;return {elec:2*m,mat:-m};}case 'powder':{const m=um*bn.prod*k;return {powder:0.6*m,steel:-0.6*m,mat:-0.1*m};}}return null;}
function depleteTick(b,amt){if(b.res==null||b.res===Infinity)return;b.res-=amt;if(b.res<=0){b.res=0;b.dep=true;log(`${B[b.type].name}の資源が尽きた（新しい場所を探そう）`,'warn');
  if(b.type==='miner'&&S.ter[b.y][b.x]===2){S.ter[b.y][b.x]=0;computeElev();renderTerrain();}}}
const YNAME={miner:'伐採所 → 木材',quarry:'石切り場 → 石材',ironmine:'鉱山 → 鉄',farm:'農場 → 食料',fishery:'漁場 → 食料',well:'エーテル採掘所 → エーテル結晶'};
function placeOKraw(type,gx,gy){const sv=S.seen;S.seen=null;const r=placeOK(type,gx,gy);S.seen=sv;return r;}
function canPlace(type,gx,gy){return !S.waveActive&&S.phase!=='night'&&placeOK(type,gx,gy)&&canAfford(costOf(type),B[type].pop);}
// その場所に建てられるか（費用は見ない）
function placeOK(type,gx,gy){
  if(gx<0||gy<0||gx>=COLS||gy>=ROWS)return false;
  if(B[type].req&&!has(B[type].req))return false;
  if(S.ter[gy][gx]===3||(S.ter[gy][gx]===4&&marshAt(gx,gy)>=2)||S.ter[gy][gx]>=6)return false;
  if(!isSeen(gx,gy))return false;
  if(type==='outpost'){if(S.mode!=='campaign'||!inTerritory(gx,gy,4))return false;}
  else if(!B[type].isMine&&!inTerritory(gx,gy))return false;
  const ex=S.grid[gy][gx];
  const WR={fence:1,swall:2,wall:3};
  if(ex&&!((type==='mg'||type==='how'||type==='cannon'||type==='mortar')&&ex.type==='wall'&&ready(ex))&&!(type==='tower'&&(ex.type==='fence'||ex.type==='swall')&&ready(ex))&&!(type==='gate'&&WALL_TYPES.includes(ex.type)&&ready(ex))&&!(WR[type]&&WR[ex.type]&&WR[type]>WR[ex.type]&&ready(ex)))return false;
  if(type!=='miner'&&type!=='quarry'&&type!=='ironmine'&&type!=='well'&&type!=='farm'&&!B[type].isMine&&S.ore[gy][gx]&&type!=='fence'&&type!=='swall'&&type!=='wall'){}
  const near=(f,r)=>{for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const nx=gx+dx,ny=gy+dy;if(nx>=0&&ny>=0&&nx<COLS&&ny<ROWS&&f(S.ter[ny][nx]))return true;}return false;};
  if(YIELD[type]&&!yieldAt(type,gx,gy))return false;
  if(type==='well'&&!S.oil[gy][gx])return false;
  if(type==='port'){let ok=false;for(let dy=-3;dy<=3&&!ok;dy++)for(let dx=-3;dx<=3;dx++){const nx=gx+dx,ny=gy+dy;if(nx>=0&&ny>=0&&nx<COLS&&ny<ROWS&&S.ter[ny][nx]===6){ok=true;break;}}if(!ok)return false;}
  if(B[type].isMine&&(ex||mineAt(gx,gy)))return false;
  if(!B[type].isMine&&mineAt(gx,gy))return false;
  for(const e of S.enemies){if(Math.hypot(e.x-(gx+.5)*T,e.y-(gy+.5)*T)<T)return false;}
  return true;
}
document.addEventListener('keydown',ev=>{
  if(ev.target.tagName==='SELECT')return;
  const kl=ev.key.toLowerCase();if(['w','a','s','d','arrowleft','arrowright','arrowup','arrowdown'].includes(kl)){keysDown.add(kl);if(kl.startsWith('arrow'))ev.preventDefault();}
  if(ev.key==='Escape'){if(['res','hire','army','retry','legend'].includes(S.overlay)){closeOverlay();return;}if(S.buildMode||S.buildPick){exitBuild();return;}S.multi=[];S.sel=null;S.selTile=null;renderBuild();renderInfo(true);}
  if(ev.key==='Tab'&&!S.overlay){ev.preventDefault();if(S.buildMode||S.buildPick)exitBuild();else enterBuild(S.lastBuild||null);return;}
  if(ev.key==='r'||ev.key==='R'){if(S.overlay==='res')closeOverlay();else if(!S.overlay)showResearch();return;}
  if(ev.key==='k'||ev.key==='K'){if(S.overlay==='army')closeOverlay();else if(!S.overlay)showArmy();return;}
  if(ev.key==='j'||ev.key==='J'){if(S.overlay==='hire')closeOverlay();else if(!S.overlay)showHire();return;}
  if(S.overlay==='report'&&(ev.key==='Enter'||ev.key==='Escape'||ev.code==='Space')){ev.preventDefault();closeOverlay();return;}
  if(S.overlay==='confirm'&&ev.key==='Escape'){closeOverlay();return;}
  if(S.overlay==='night'&&ev.key==='Enter'){ev.preventDefault();closeOverlay();morning();return;}
  if(!S.overlay&&ev.key==='Escape'&&S.aimNaval){S.aimNaval=false;return;}
  if(!S.overlay&&(ev.key==='v'||ev.key==='V')){toggleNaval();return;}
  if(!S.overlay&&(ev.key==='z'||ev.key==='Z')){toggleFull();return;}
  if(!S.overlay&&(ev.key==='t'||ev.key==='T')){toggleLv();return;}
  if(ev.key==='l'||ev.key==='L'){if(S.overlay==='legend')closeOverlay();else if(!S.overlay)showLegend();return;}
  if(S.overlay)return;

  if(ev.key==='Enter'){ev.preventDefault();endTurn();}
  if(ev.key==='h'||ev.key==='H')toggleHeat();
  if(ev.key==='x'||ev.key==='X')repairAll();

function terEffect(t,lv){

  if(t===2)return `敵の移動 -${Math.round((1-FOREST_SLOW[lv])*100)}%・部隊 -${[0,20,35,50][lv]}%。ここの施設と部隊は被害 -${10*lv}%（遮蔽）。建設可`;
  if(t===4)return `敵の移動 -${Math.round((1-MARSH_SLOW[lv])*100)}%・部隊 -${[0,30,50,70][lv]}%。${lv===1?'建設可':'<span style="color:#ff8a7a">建設不可</span>'}`;

}

const NW=178,NH=72,GX=46,GY=14;
function treeLayout(cat){
  const list=TECH.filter(t=>t.cat===cat),inTab=id=>list.some(t=>t.id===id);
  const PRE=t=>(t.pre||[]).filter(inTab).filter(p=>techRank(techOf(p))===techRank(t));
  const dep={};const D=t=>{if(dep[t.id]!=null)return dep[t.id];const ps=PRE(t);dep[t.id]=ps.length?1+Math.max(...ps.map(p=>D(techOf(p)))):0;return dep[t.id];};
  list.forEach(D);
  const pos={},ranks=[];let x0=10;const HY=30;
  const maxR=Math.max(...list.map(techRank));
  for(let r=1;r<=maxR;r++){
    const inR=list.filter(t=>techRank(t)===r);if(!inR.length)continue;
    const g=list.find(t=>t.gate===r+1);
    let md=Math.max(...inR.map(t=>dep[t.id]));
    const plain=inR.filter(t=>!t.gate);
    if(md===0&&plain.length>5){const nc=Math.ceil(plain.length/5),per=Math.ceil(plain.length/nc);plain.forEach((t,i)=>dep[t.id]=Math.floor(i/per));md=nc-1;}
    for(let d=0;d<=md;d++){
      const col=inR.filter(t=>dep[t.id]===d&&!t.gate);
      const pr=t=>{const ps=PRE(t).map(p=>pos[p]&&pos[p].row).filter(v=>v!=null);return ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:-1;};
      col.sort((a,b)=>pr(a)-pr(b)||list.indexOf(a)-list.indexOf(b));
      let next=0;
      for(const t of col){const want=Math.max(next,Math.round(Math.max(0,pr(t))));pos[t.id]={col:d,row:want,x:x0+d*(NW+GX),y:HY+want*(NH+GY)};next=want+1;}
    }
    const xEnd=x0+(md+1)*(NW+GX)-GX;
    ranks.push({r,x:x0-6,w:xEnd-x0+12});
    x0=xEnd+GX;
    if(g){pos[g.id]={col:0,row:0,x:x0,y:HY+Math.max(0,Math.round((Math.max(...inR.map(t=>pos[t.id]?pos[t.id].row:0)))/2))*(NH+GY),gate:true};ranks.push({gateX:x0});x0+=NW+GX;}
  }
  const W=x0,H=Math.max(...Object.values(pos).map(p=>p.y))+NH+20;
  return{list,pos,inTab,W,H,ranks,PRE};
}

const PREP_CH=[[50,53,57],[46,50,53],[43,46,50],[45,49,52]];
const BAT_ROOT=[38,38,34,36,38,38,41,40];
const BAT_CH=[[62,65,69],[62,65,69],[58,62,65],[60,64,67],[62,65,69],[62,65,69],[65,69,72],[64,67,71]];
const MELO=[74,null,72,74,77,null,76,74, 72,null,70,69,70,null,72,null, 74,null,72,74,77,null,79,77, 76,null,74,72,73,null,null,null];
function auMusicFor(){
  if(!AU.ctx||!S)return;
  const want=S.over?null:(S.waveActive?'battle':'prep');
  AU.intensity=S.waveActive?(S.wave>=finalWave()?2:S.wave>=4?1:0):0;
  if(want!==AU.track){
    const t=AU.ctx.currentTime;
    AU.music.gain.cancelScheduledValues(t);AU.music.gain.setValueAtTime(AU.music.gain.value,t);
    AU.music.gain.linearRampToValueAtTime(0.0001,t+0.25);
    AU.music.gain.linearRampToValueAtTime(AU.bgmVol*0.9,t+0.6);
    AU.track=want;AU.step=0;AU.nextT=t+0.3;
  }
}
function auSched(){
  if(!AU.ctx||!AU.track)return;
  const c=AU.ctx;if(AU.nextT<c.currentTime-0.5)AU.nextT=c.currentTime+0.05;
  while(AU.nextT<c.currentTime+0.15){
    if(AU.track==='prep'){playPrep(AU.step,AU.nextT);AU.nextT+=60/72/4;}
    else{playBattle(AU.step,AU.nextT);AU.nextT+=60/150/4;}
    AU.step++;
  }
}
function playPrep(st,t){
  const M=AU.music;const bar=Math.floor(st/32)%4;const ch=PREP_CH[bar];const sp=60/72/4;
  if(st%32===0){
    for(const n of ch){tone(mtof(n),t,sp*32+1.2,{type:'sawtooth',vol:0.048,a:1.6,r:1.5,lp:650,dest:M,det:-6});tone(mtof(n+12),t,sp*32+1.2,{type:'triangle',vol:0.04,a:2,r:1.5,dest:M,det:5});}
    tone(mtof(ch[0]-24),t,sp*32+0.5,{vol:0.198,a:1,r:1,dest:M});
  }
  if(st%2===0){const arp=[0,1,2,1,2,0,1,2];const i=(st/2)%8;const n=ch[arp[i]]+24;if(!(i===7&&bar%2))tone(mtof(n),t,0.5,{type:'triangle',vol:0.048,dest:M,send:true,r:0.45});}
  if(st%64===40)tone(1320,t,0.9,{vol:0.044,dest:M,send:true});           // ソナー音
  if(st%16===0)noise(t,0.15,{ft:'bandpass',f:120,vol:0.066,dest:M});      // 遠くの心拍のような低音
  if(st%16===3)noise(t,0.12,{ft:'bandpass',f:110,vol:0.044,dest:M});
}
function playBattle(st,t){
  const M=AU.music;const s=st%16;const bar=Math.floor(st/16)%8;const root=BAT_ROOT[bar];const it=AU.intensity;
  // 打楽器
  if(s===0||s===8||(s===10&&bar%2)||(it>=1&&s===14&&bar%4===3)){tone(150,t,0.22,{to:40,vol:0.26,dest:M});noise(t,0.02,{ft:'highpass',f:2000,vol:0.068,dest:M});}
  if(s===4||s===12){noise(t,0.16,{ft:'bandpass',f:1800,q:0.8,vol:0.16,dest:M});tone(220,t,0.08,{to:150,type:'triangle',vol:0.102,dest:M});}
  if(bar%4===3&&s>=12)noise(t,0.08,{ft:'bandpass',f:2000,vol:0.119+0.02*(s-12),dest:M});  // スネアロール
  if(s%2===0||it>=2)noise(t,s%4===2?0.07:0.03,{ft:'highpass',f:7000,vol:s%4===2?0.05:0.025,dest:M});
  // ベース（16分の刻み）
  const bp=[0,0,12,0,0,0,12,0,0,0,12,0,0,7,12,10];
  tone(mtof(root+bp[s]),t,0.09,{type:'sawtooth',vol:0.119,lp:700,lpTo:200,dest:M});
  // ブラスの刻み
  if(s===3||s===11||(s===14&&bar%2)){for(const n of BAT_CH[bar])tone(mtof(n-12),t,0.16,{type:'sawtooth',vol:0.043,lp:2600,lpTo:500,dest:M});}
  // 旋律（第4襲撃以降）
  if(it>=1&&s%2===0){const i=(Math.floor(st/2))%32;const m=MELO[i];if(m)tone(mtof(m),t,0.22,{type:'square',vol:0.048,lp:2200,dest:M,send:true});}
  if(st%128===0)tone(mtof(root-12),t,60/150*8,{type:'sawtooth',vol:0.051,lp:300,a:0.5,dest:M});
}

    if(st[key])box.classList.add('closed');
    h.title='クリックで開閉';
    h.addEventListener('click',()=>{box.classList.toggle('closed');st[key]=box.classList.contains('closed');try{localStorage.setItem('bd_boxes',JSON.stringify(st));}catch(e){}});
  });
})();
// ===== ループ =====
let last=performance.now(),uiT=0;
function loop(now){
  let dt=Math.min(0.05,(now-last)/1000);last=now;
  panCam(dt);
  if(!S.overlay&&!S.over){
    if(S.waveActive){if(!S.paused)for(let i=0;i<S.speed;i++)update(dt);}
    else if(!S.paused)updateIdle(dt);
  }
  draw();
  S.fogT=(S.fogT||0)+dt;if(S.fogT>0.5){S.fogT=0;revealAll();}
  uiT+=dt;if(uiT>0.2){uiT=0;renderTop();renderMode();renderEcon();renderIntel();renderResBox();renderBuild();renderInfo(false);renderCmds(false);renderArmyBox(false);tabBadges();}
  requestAnimationFrame(loop);
}
auUi();newState();renderAll();resizeView();setTimeout(resizeView,300);showTitle();requestAnimationFrame(loop);
</script>
